<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DSPF Theory" />
  <title>PMTA Dorothy Sutton Performance Festival - Piano Theory Practice (Protected)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #e2e8f0;
      --card: #ffffff;
      --foreground: #0f172a;
      --muted-foreground: #64748b;
      --border: #cbd5e1;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    .touch-select {
      min-height: 38px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .level-btn {
      min-height: 40px;
      padding: 6px 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    #dspfPagesContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding-bottom: 40px;
    }
    .dspf-page {
      width: 8.5in;
      min-height: 11in;
      height: 11in;
      max-height: 11in;
      background: #ffffff;
      color: #000000;
      padding: 0.48in 0.6in 0.42in 0.6in;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 4px 10px -2px rgba(0, 0, 0, 0.08);
      border: 1px solid #cbd5e1;
      overflow: hidden;
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", Georgia, serif;
      font-size: 14.2px;
      line-height: 1.32;
    }
    .dspf-page svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .print-q-block {
      margin-bottom: 16px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .print-q-text {
      font-size: 14.2px;
      margin-bottom: 6px;
      line-height: 1.28;
    }
    .print-underline {
      display: inline-block;
      border-bottom: 1.1px solid #000;
      min-width: 46px;
      text-align: center;
      vertical-align: bottom;
      line-height: 1.1;
      padding: 0 3px;
    }
    .print-ans-text {
      color: #d00000;
      font-weight: bold;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .mc-circle-ans {
      border: 1.8px solid #d00000;
      border-radius: 999px;
      padding: 1px 7px;
      color: #d00000;
      font-weight: bold;
    }
    @media screen and (max-width: 860px) {
      #dspfPagesContainer {
        overflow-x: auto;
        align-items: flex-start;
        padding-left: 8px;
        padding-right: 8px;
      }
    }
    @media print {
      @page {
        size: letter portrait;
        margin: 0;
      }
      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print,
      #authGateOverlay {
        display: none !important;
      }
      #mainAppWrapper {
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #dspfPagesContainer {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
      }
      .dspf-page {
        width: 8.5in !important;
        min-height: 11in !important;
        height: 11in !important;
        max-height: 11in !important;
        margin: 0 !important;
        padding: 0.48in 0.6in 0.42in 0.6in !important;
        border: none !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: hidden !important;
      }
      .dspf-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-3 md:p-6">

  <!-- API KEY AUTHENTICATION GATE -->
  <div id="authGateOverlay" class="min-h-[88vh] flex items-center justify-center px-3">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-lg p-6 sm:p-8 space-y-5">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl shadow-sm">
          &#127929;
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-snug">
            PMTA / DSPF Piano Theory Trainer
          </h1>
          <p class="text-xs text-slate-500 mt-0.5">
            Protected Curriculum (Primer &ndash; Level 8) &middot; AES-256 Encrypted
          </p>
        </div>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-xs text-slate-600 leading-relaxed">
        &#128274; This exam trainer is private and encrypted with <b>AES-256</b>. Please enter your <b>API Key</b> below to decrypt and access the interactive exams.
      </div>

      <form id="authGateForm" onsubmit="handleUnlockSubmit(event)" class="space-y-4">
        <div class="space-y-1.5">
          <label for="apiKeyInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-700">
            API Key / Access Key
          </label>
          <div class="relative flex items-center">
            <input
              id="apiKeyInput"
              type="password"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Enter API Key (e.g., DSPF-2026-...)"
              required
              class="w-full px-3.5 py-2.5 pr-16 rounded-xl border border-slate-300 text-sm font-mono text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
            />
            <button
              type="button"
              onclick="toggleKeyVisibility()"
              id="toggleKeyBtn"
              class="absolute right-2 px-2.5 py-1 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
            >
              Show
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer select-none">
          <input id="rememberKeyCheckbox" type="checkbox" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4" />
          <span>Remember API Key on this device (iPad / Browser)</span>
        </label>

        <div id="authErrorMsg" class="hidden text-xs font-medium text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-3"></div>

        <button
          id="unlockSubmitBtn"
          type="submit"
          class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm shadow-sm transition flex items-center justify-center gap-2"
        >
          <span>&#128275; Unlock Exam Trainer</span>
        </button>
      </form>
    </div>
  </div>

  const STORAGE_KEY = "dspf_piano_trainer_api_key_v1";

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function bytesToHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function toggleKeyVisibility() {
    const inp = document.getElementById('apiKeyInput');
    const btn = document.getElementById('toggleKeyBtn');
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.textContent = 'Hide';
    } else {
      inp.type = 'password';
      btn.textContent = 'Show';
    }
  }

  async function tryDecryptWithKey(rawKey) {
    const cleanKey = (rawKey || '').trim();
    if (!cleanKey) throw new Error('Empty key');

    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
      'raw',
      enc.encode(cleanKey),
      { name: 'PBKDF2' },
      false,
      ['deriveKey']
    );

    const aesKey = await window.crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: b64ToBytes(ENCRYPTED_BUNDLE.salt),
        iterations: 25000,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-CBC', length: 256 },
      false,
      ['decrypt']
    );

    const decryptedBuf = await window.crypto.subtle.decrypt(
      { name: 'AES-CBC', iv: b64ToBytes(ENCRYPTED_BUNDLE.iv) },
      aesKey,
      b64ToBytes(ENCRYPTED_BUNDLE.ciphertext)
    );

    const hashBuf = await window.crypto.subtle.digest('SHA-256', decryptedBuf);
    const actualHash = bytesToHex(new Uint8Array(hashBuf));
    if (actualHash !== ENCRYPTED_BUNDLE.hash) {
      throw new Error('Integrity verification failed');
    }

    const dec = new TextDecoder('utf-8');
    return JSON.parse(dec.decode(decryptedBuf));
  }

  window.__LOCK_APP = function() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
    window.location.href = window.location.pathname;
  };

  function mountDecryptedApp(payload) {
    document.getElementById('authGateOverlay').classList.add('hidden');
    const mount = document.getElementById('decryptedAppMount');
    mount.innerHTML = payload.html;
    mount.classList.remove('hidden');

    const scriptEl = document.createElement('script');
    scriptEl.textContent = payload.js;
    document.body.appendChild(scriptEl);
  }

  async function handleUnlockSubmit(e) {
    if (e) e.preventDefault();
    const inp = document.getElementById('apiKeyInput');
    const errBox = document.getElementById('authErrorMsg');
    const btn = document.getElementById('unlockSubmitBtn');
    const remember = document.getElementById('rememberKeyCheckbox').checked;

    errBox.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = '<span>&#9203; Decrypting with AES-256...</span>';

    try {
      const keyVal = inp.value.trim();
      const payload = await tryDecryptWithKey(keyVal);
      if (remember) {
        try { localStorage.setItem(STORAGE_KEY, keyVal); } catch (err) {}
      } else {
        try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
      }
      mountDecryptedApp(payload);
    } catch (err) {
      errBox.innerHTML = '&#10060; Invalid API Key. Decryption failed &mdash; please verify your key and try again.';
      errBox.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<span>&#128275; Unlock Exam Trainer</span>';
    }
  }

  (async function autoUnlockOnLoad() {
    try {
      const params = new URLSearchParams(window.location.search);
      const urlKey = params.get('key') || params.get('api_key');
      const savedKey = urlKey || localStorage.getItem(STORAGE_KEY);
      if (savedKey) {
        const payload = await tryDecryptWithKey(savedKey);
        if (urlKey) {
          try { localStorage.setItem(STORAGE_KEY, urlKey.trim()); } catch (e) {}
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        mountDecryptedApp(payload);
      }
    } catch (e) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
    }
  })();
  </script>
