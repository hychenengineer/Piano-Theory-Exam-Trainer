<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-3 md:p-6">

<script>
// ============================================================================
// MATHEMATICAL MUSIC THEORY ENGINE
// ============================================================================

const LEVELS = [
  { id: 'P', label: 'Primer Level', name: 'Primer Level', footerName: 'Primer' },
  { id: '1', label: 'Level 1', name: 'Level 1', footerName: '1' },
  { id: '2', label: 'Level 2', name: 'Level 2', footerName: '2' },
  { id: '3', label: 'Level 3', name: 'Level 3', footerName: '3' },
  { id: '4', label: 'Level 4', name: 'Level 4', footerName: '4' },
  { id: '5', label: 'Level 5', name: 'Level 5', footerName: '5' },
  { id: '6', label: 'Level 6', name: 'Level 6', footerName: '6' },
  { id: '7', label: 'Level 7', name: 'Level 7', footerName: '7' },
  { id: '8', label: 'Level 8', name: 'Level 8', footerName: '8' }
];

const SYLLABUS_INFO = {
  'P': '<b>Primer Level Official Format (3 Pages, Q1–Q8):</b> White key names · Grand Staff word-spelling notes · Keyboard intervals (2nd–5th) · Musical note addition/subtraction · Grand Staff intervals (2nd–5th) · Symbol & term matching (A–J) · Adding barlines (3/4, 4/4) · Completing incomplete measures with one note value.',
  '1': '<b>Level 1 Official Format (3 Pages, Q1–Q8):</b> Sharp & flat black key names · Enharmonic white key names · Grand Staff notes with accidentals · Keyboard intervals (2nd–6th) · Grand Staff intervals (2nd–6th) · Adding one note to complete measures (3/4, 2/4) · Adding one REST to complete measures (4/4) · 5-measure Grand Staff piece analysis (a–h).',
  '2': '<b>Level 2 Official Format (3 Pages, Q1–Q7):</b> Grand Staff notes with ledger lines & accidentals · Grand Staff intervals (2nd–8va) · Adding one note to complete measures (4/4, 6/8) · Adding one REST to complete measures (3/4) · Identifying major key signatures & writing 1-octave ascending scales (C, F, G Major) · Naming root-position major triads · 8-measure piece analysis (a–j).',
  '3': '<b>Level 3 Official Format (3 Pages, Q1–Q8):</b> Grand Staff notes with ledger lines · Major & Perfect intervals (Maj., Per. 2nd–8va) · Identifying key signatures & writing 1-octave ascending major scales (D, A, E, B, F, G) · Naming major triads · Transposing a 4-measure phrase up a whole step · Adding barlines in 6/8 · Multiple-choice rhythm completion (3/4, 4/4, 9/8) · 8-measure piece analysis (a–h).',
  '4': '<b>Level 4 Official Format (3 Pages, Q1–Q9):</b> Grand Staff notes (inner ledger lines) · Drawing a note above to complete Maj./Per. intervals · Identifying Major & minor root-position triads · Transposing a 4-measure Grand Staff passage · Identifying major key signatures (up to 6 sharps/flats) · Tonic, Subdominant & Dominant table · Multiple-choice rhythm completion · Adding barlines (6/8, Common time) · Matching terms (a–f).',
  '5': '<b>Level 5 Official Format (3 Pages, Q1–Q8):</b> Identifying Maj., min., Per. intervals · Drawing a note above to complete Maj., min., Per. intervals · Identifying triads by Root, Quality & Inversion (root, 1st, 2nd) · Transposing a 4-measure Grand Staff passage · Identifying Major & relative minor keynotes · Terminology multiple-choice (a–f) · Identifying minor scales (natural, harmonic, melodic) · Rhythm completion.',
  '6': '<b>Level 6 Official Format (3 Pages, Q1–Q8):</b> Identifying Maj., min., Per., Aug., dim. intervals · Drawing a note above to complete intervals · Identifying Maj., min., Aug., dim. triads · Transposing a 4-measure Grand Staff passage · Relative Major & minor keynotes (6 staves) · Writing 1-octave minor scales (natural, harmonic, melodic ascending & descending) · Rhythm completion · Terminology multiple-choice.',
  '7': '<b>Level 7 Official Format (3 Pages, Q1–Q9):</b> Identifying Maj., min., Per., Aug., dim. intervals · Drawing a note above to complete intervals · Identifying triads by Root, Quality & Inversion · Transposing a 6/8 Grand Staff passage · Roman Numeral Analysis in a major key · Relative Major & minor key signatures · Parallel Major & minor key signature writing · Equivalent beat count matching · Terminology multiple-choice.',
  '8': '<b>Level 8 Official Format (3 Pages, Q1–Q10):</b> Identifying 7th chords & inversions (7, 6/5, 4/3, 4/2) · Constructing 7th chords · Constructing 1-octave ascending Church Modes (Ionian–Locrian) · Identifying cadences (authentic, half, plagal, deceptive) · Simple/Compound Duple/Triple/Quadruple meter · Labeling boxed non-harmonic tones · Labeling ornaments · Chorale Roman numeral analysis · Matching 13 genres/forms · Terminology multiple-choice.'
};

const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const BASE_SEMI = [0, 2, 4, 5, 7, 9, 11];

function posToLetter(pos) {
  const idx = ((pos % 7) + 7) % 7;
  return LETTERS[idx];
}

function posToSemitone(pos, acc = '') {
  const oct = Math.floor(pos / 7);
  const idx = ((pos % 7) + 7) % 7;
  let offset = 0;
  if (acc === '#' || acc === '♯') offset = 1;
  else if (acc === 'b' || acc === '♭') offset = -1;
  else if (acc === 'x' || acc === '𝄪') offset = 2;
  else if (acc === 'bb' || acc === '𝄫') offset = -2;
  return oct * 12 + BASE_SEMI[idx] + offset;
}

function formatAcc(acc) {
  if (acc === '#' || acc === '♯') return '♯';
  if (acc === 'b' || acc === '♭') return '♭';
  if (acc === 'n' || acc === '♮') return '♮';
  if (acc === 'x' || acc === '𝄪') return '𝄪';
  if (acc === 'bb' || acc === '𝄫') return '𝄫';
  return '';
}

function noteNameFromPos(pos, acc = '') {
  return posToLetter(pos) + formatAcc(acc);
}

function computeIntervalName(pos1, acc1, pos2, acc2, includeQuality = true) {
  const diff = Math.abs(pos2 - pos1);
  const num = diff + 1;
  const ordMap = { 1: '1st', 2: '2nd', 3: '3rd', 4: '4th', 5: '5th', 6: '6th', 7: '7th', 8: '8va' };
  const ord = ordMap[num] || `${num}th`;
  if (!includeQuality) return ord;

  const lowPos = pos1 <= pos2 ? pos1 : pos2;
  const lowAcc = pos1 <= pos2 ? acc1 : acc2;
  const highPos = pos1 <= pos2 ? pos2 : pos1;
  const highAcc = pos1 <= pos2 ? acc2 : acc1;

  const semi1 = posToSemitone(lowPos, lowAcc);
  const semi2 = posToSemitone(highPos, highAcc);
  const dSemi = semi2 - semi1;

  const majorOrPerfectBase = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11, 8: 12 }[num];
  const isPerfectFamily = (num === 1 || num === 4 || num === 5 || num === 8);

  let qual = '';
  if (isPerfectFamily) {
    if (dSemi === majorOrPerfectBase) qual = 'Per.';
    else if (dSemi === majorOrPerfectBase + 1) qual = 'Aug.';
    else if (dSemi === majorOrPerfectBase - 1) qual = 'dim.';
  } else {
    if (dSemi === majorOrPerfectBase) qual = 'Maj.';
    else if (dSemi === majorOrPerfectBase - 1) qual = 'min.';
    else if (dSemi === majorOrPerfectBase + 1) qual = 'Aug.';
    else if (dSemi === majorOrPerfectBase - 2) qual = 'dim.';
  }
  return `${qual} ${ord}`;
}

// Compute the exact top note (pos2, acc2) given bottom note (pos1, acc1) and target interval (qual, num)
function buildTopNoteForInterval(pos1, acc1, qual, num) {
  const pos2 = pos1 + (num - 1);
  const baseSemi = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11, 8: 12 }[num];
  const isPerf = (num === 1 || num === 4 || num === 5 || num === 8);
  let targetSemiDiff = baseSemi;
  if (isPerf) {
    if (qual === 'Aug.') targetSemiDiff = baseSemi + 1;
    else if (qual === 'dim.') targetSemiDiff = baseSemi - 1;
  } else {
    if (qual === 'min.') targetSemiDiff = baseSemi - 1;
    else if (qual === 'Aug.') targetSemiDiff = baseSemi + 1;
    else if (qual === 'dim.') targetSemiDiff = baseSemi - 2;
  }
  const s1 = posToSemitone(pos1, acc1);
  const naturalS2 = posToSemitone(pos2, '');
  const neededOffset = (s1 + targetSemiDiff) - naturalS2;
  let acc2 = '';
  if (neededOffset === 1) acc2 = '#';
  else if (neededOffset === -1) acc2 = 'b';
  else if (neededOffset === 2) acc2 = 'x';
  else if (neededOffset === -2) acc2 = 'bb';
  return { pos2, acc2, ansName: noteNameFromPos(pos2, acc2) };
}

function makeVerifiedTriad(staff, rootPos, acc1, acc2, acc3, style = 'full') {
  const rootName = noteNameFromPos(rootPos, acc1);
  const s1 = posToSemitone(rootPos, acc1);
  const s2 = posToSemitone(rootPos + 2, acc2);
  const s3 = posToSemitone(rootPos + 4, acc3);
  const d3 = s2 - s1;
  const d5 = s3 - s1;

  let qual = '';
  if (d3 === 4 && d5 === 7) {
    qual = style === 'full' ? 'major' : (style === 'l4' ? 'maj.' : 'Maj.');
  } else if (d3 === 3 && d5 === 7) {
    qual = 'min.';
  } else if (d3 === 4 && d5 === 8) {
    qual = 'Aug.';
  } else if (d3 === 3 && d5 === 6) {
    qual = 'dim.';
  }
  const ans = `${rootName} ${qual}`;
  return { staff, rootPos, acc1, acc2, acc3, rootName, qual, ans };
}

// ============================================================================
// SVG MUSIC ENGRAVING PRIMITIVES
// ============================================================================

function getNoteY(staff, pos, topY, bassY, ls = 8.5) {
  const halfStep = ls / 2;
  if (staff === 'treble') {
    return (topY + 4 * ls) - (pos - 2) * halfStep;
  } else {
    return bassY - (pos - (-2)) * halfStep;
  }
}

function drawLedgerLinesSVG(staff, pos, x, topY, bassY, ls = 8.5, color = '#000') {
  let s = '';
  if (staff === 'treble') {
    for (let p = 0; p >= pos; p -= 2) {
      const ly = getNoteY('treble', p, topY, bassY, ls);
      s += `<line x1="${x - 10}" y1="${ly}" x2="${x + 10}" y2="${ly}" stroke="${color}" stroke-width="1.1"/>`;
    }
    for (let p = 12; p <= pos; p += 2) {
      const ly = getNoteY('treble', p, topY, bassY, ls);
      s += `<line x1="${x - 10}" y1="${ly}" x2="${x + 10}" y2="${ly}" stroke="${color}" stroke-width="1.1"/>`;
    }
  } else {
    for (let p = 0; p <= pos; p += 2) {
      const ly = getNoteY('bass', p, topY, bassY, ls);
      s += `<line x1="${x - 10}" y1="${ly}" x2="${x + 10}" y2="${ly}" stroke="${color}" stroke-width="1.1"/>`;
    }
    for (let p = -12; p >= pos; p -= 2) {
      const ly = getNoteY('bass', p, topY, bassY, ls);
      s += `<line x1="${x - 10}" y1="${ly}" x2="${x + 10}" y2="${ly}" stroke="${color}" stroke-width="1.1"/>`;
    }
  }
  return s;
}

function drawAccidentalSVG(acc, x, y, color = '#000', dx = -17) {
  if (!acc) return '';
  if (acc === '#' || acc === '♯') return `<text x="${x + dx}" y="${y + 5.5}" font-size="16.5px" font-family="Segoe UI Symbol, serif" fill="${color}">♯</text>`;
  if (acc === 'b' || acc === '♭') return `<text x="${x + dx}" y="${y + 5.5}" font-size="16.5px" font-family="Segoe UI Symbol, serif" fill="${color}">♭</text>`;
  if (acc === 'n' || acc === '♮') return `<text x="${x + dx}" y="${y + 5.5}" font-size="16.5px" font-family="Segoe UI Symbol, serif" fill="${color}">♮</text>`;
  if (acc === 'x' || acc === '𝄪') return `<text x="${x + dx - 1}" y="${y + 4.5}" font-size="14px" font-weight="bold" font-family="Segoe UI Symbol, sans-serif" fill="${color}">𝄪</text>`;
  if (acc === 'bb' || acc === '𝄫') return `<text x="${x + dx - 6}" y="${y + 5.5}" font-size="15.5px" font-family="Segoe UI Symbol, serif" fill="${color}">♭♭</text>`;
  return '';
}

function drawWholeNoteSVG(x, y, acc = '', color = '#000', accDx = -17) {
  let s = drawAccidentalSVG(acc, x, y, color, accDx);
  s += `<ellipse cx="${x}" cy="${y}" rx="6.4" ry="4.3" fill="${color}"/>`;
  s += `<ellipse cx="${x}" cy="${y}" rx="3.5" ry="2.3" transform="rotate(-22 ${x} ${y})" fill="#fff"/>`;
  return s;
}

function drawPitchedNoteSVG(x, y, dur, stemDir = 'up', acc = '', color = '#000', mods = {}) {
  let s = drawAccidentalSVG(acc, x, y, color, mods.accDx !== undefined ? mods.accDx : -16);
  const isHollow = (dur === 'w' || dur === 'h' || dur === 'hd');
  if (dur === 'w') {
    s += `<ellipse cx="${x}" cy="${y}" rx="6.3" ry="4.2" fill="${color}"/>`;
    s += `<ellipse cx="${x}" cy="${y}" rx="3.4" ry="2.2" transform="rotate(-22 ${x} ${y})" fill="#fff"/>`;
  } else {
    s += `<ellipse cx="${x}" cy="${y}" rx="5.5" ry="3.9" transform="rotate(-20 ${x} ${y})" fill="${isHollow ? '#fff' : color}" stroke="${color}" stroke-width="1.3"/>`;
    const stemX = stemDir === 'up' ? x + 5.0 : x - 5.0;
    const stemY2 = stemDir === 'up' ? y - 27 : y + 27;
    s += `<line x1="${stemX}" y1="${y}" x2="${stemX}" y2="${stemY2}" stroke="${color}" stroke-width="1.25"/>`;
    if (dur === '8' || dur === '8d') {
      if (stemDir === 'up') {
        s += `<path d="M ${stemX} ${stemY2} Q ${stemX + 9} ${stemY2 + 6} ${stemX + 6} ${stemY2 + 15}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
      } else {
        s += `<path d="M ${stemX} ${stemY2} Q ${stemX + 9} ${stemY2 - 6} ${stemX + 6} ${stemY2 - 15}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
      }
    }
  }
  if (dur === 'hd' || dur === 'qd' || dur === '8d') {
    s += `<circle cx="${x + 9}" cy="${y - 1}" r="1.8" fill="${color}"/>`;
  }
  if (mods.staccato) {
    const dotY = stemDir === 'up' ? y + 9 : y - 9;
    s += `<circle cx="${x}" cy="${dotY}" r="1.8" fill="${color}"/>`;
  }
  if (mods.accent) {
    const accY = stemDir === 'up' ? y + 13 : y - 11;
    s += `<path d="M ${x - 5} ${accY - 3} L ${x + 5} ${accY} L ${x - 5} ${accY + 3}" fill="none" stroke="${color}" stroke-width="1.2"/>`;
  }
  if (mods.tenuto) {
    const tenY = stemDir === 'up' ? y + 9 : y - 9;
    s += `<line x1="${x - 5}" y1="${tenY}" x2="${x + 5}" y2="${tenY}" stroke="${color}" stroke-width="1.4"/>`;
  }
  if (mods.boxed) {
    s += `<rect x="${x - 9}" y="${y - 9}" width="18" height="18" fill="none" stroke="#000" stroke-width="1.3"/>`;
  }
  return s;
}

function drawKeySigOnStaffSVG(clef, accType, count, startX, topY, ls = 8.5, color = '#000') {
  if (!count || count <= 0) return '';
  const trebleSharps = [10, 7, 11, 8, 5, 9, 6];
  const bassSharps   = [-4, -7, -3, -6, -9, -5, -8];
  const trebleFlats  = [6, 9, 5, 8, 4, 7, 3];
  const bassFlats    = [-8, -5, -9, -6, -10, -7, -11];

  const posArr = (accType === '#' || accType === '♯')
    ? (clef === 'treble' ? trebleSharps : bassSharps)
    : (clef === 'treble' ? trebleFlats : bassFlats);

  let s = '';
  const sym = (accType === '#' || accType === '♯') ? '♯' : '♭';
  for (let i = 0; i < count; i++) {
    const pos = posArr[i];
    const y = getNoteY(clef, pos, topY, topY, ls);
    const x = startX + i * 10.5;
    s += `<text x="${x}" y="${y + 5.5}" font-size="16.5px" font-family="Segoe UI Symbol, serif" fill="${color}">${sym}</text>`;
  }
  return s;
}

function drawTimeSigOnStaffSVG(ts, x, topY, ls = 8.5) {
  if (ts === 'C' || ts === 'c') {
    return `<text x="${x}" y="${topY + 2.75 * ls}" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="${ls * 2.8}px">C</text>`;
  }
  if (ts === 'cut' || ts === '¢') {
    const cy = topY + 2 * ls;
    return `<text x="${x}" y="${topY + 2.75 * ls}" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="${ls * 2.8}px">C</text>` +
           `<line x1="${x}" y1="${cy - 11}" x2="${x}" y2="${cy + 11}" stroke="#000" stroke-width="1.3"/>`;
  }
  return `<text x="${x}" y="${topY + 1.85 * ls}" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="${ls * 2.15}px">${ts[0]}</text>` +
         `<text x="${x}" y="${topY + 3.85 * ls}" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="${ls * 2.15}px">${ts[1]}</text>`;
}

function drawGrandStaffBaseSVG(svgWidth, topY, bassY, ls = 8.5, hasEndDoubleBar = true) {
  let s = '';
  const leftX = 24, rightX = svgWidth - 8;
  const botY = bassY + 4 * ls;

  for (let i = 0; i < 5; i++) {
    s += `<line x1="${leftX}" y1="${topY + i * ls}" x2="${rightX}" y2="${topY + i * ls}" stroke="#000" stroke-width="0.95"/>`;
    s += `<line x1="${leftX}" y1="${bassY + i * ls}" x2="${rightX}" y2="${bassY + i * ls}" stroke="#000" stroke-width="0.95"/>`;
  }
  s += `<line x1="${leftX}" y1="${topY}" x2="${leftX}" y2="${botY}" stroke="#000" stroke-width="1.4"/>`;
  if (hasEndDoubleBar) {
    s += `<line x1="${rightX - 4.5}" y1="${topY}" x2="${rightX - 4.5}" y2="${botY}" stroke="#000" stroke-width="0.95"/>`;
    s += `<line x1="${rightX}" y1="${topY}" x2="${rightX}" y2="${botY}" stroke="#000" stroke-width="2.4"/>`;
  } else {
    s += `<line x1="${rightX}" y1="${topY}" x2="${rightX}" y2="${botY}" stroke="#000" stroke-width="1.1"/>`;
  }

  const midY = (topY + botY) / 2;
  s += `<path d="M ${leftX - 3} ${topY} C ${leftX - 13} ${topY + 12}, ${leftX - 5} ${midY - 14}, ${leftX - 15} ${midY} C ${leftX - 5} ${midY + 14}, ${leftX - 13} ${botY - 12}, ${leftX - 3} ${botY}" fill="none" stroke="#000" stroke-width="1.5"/>`;
  s += `<text x="${leftX + 4}" y="${topY + 3.3 * ls}" font-size="${ls * 4.7}px" font-family="Segoe UI Symbol, serif">&#119070;</text>`;
  s += `<text x="${leftX + 4}" y="${bassY + 2.95 * ls}" font-size="${ls * 3.7}px" font-family="Segoe UI Symbol, serif">&#119074;</text>`;
  return { svg: s, leftX, rightX };
}

function drawSingleStaffBaseSVG(svgWidth, topY, ls = 8.5, clef = 'treble', hasEndDoubleBar = true) {
  let s = '';
  const leftX = 16, rightX = svgWidth - 8;
  const botY = topY + 4 * ls;
  for (let i = 0; i < 5; i++) {
    s += `<line x1="${leftX}" y1="${topY + i * ls}" x2="${rightX}" y2="${topY + i * ls}" stroke="#000" stroke-width="0.95"/>`;
  }
  s += `<line x1="${leftX}" y1="${topY}" x2="${leftX}" y2="${botY}" stroke="#000" stroke-width="1.3"/>`;
  if (hasEndDoubleBar) {
    s += `<line x1="${rightX - 4.5}" y1="${topY}" x2="${rightX - 4.5}" y2="${botY}" stroke="#000" stroke-width="0.95"/>`;
    s += `<line x1="${rightX}" y1="${topY}" x2="${rightX}" y2="${botY}" stroke="#000" stroke-width="2.4"/>`;
  } else {
    s += `<line x1="${rightX}" y1="${topY}" x2="${rightX}" y2="${botY}" stroke="#000" stroke-width="1.1"/>`;
  }
  if (clef === 'treble') {
    s += `<text x="${leftX + 4}" y="${topY + 3.3 * ls}" font-size="${ls * 4.7}px" font-family="Segoe UI Symbol, serif">&#119070;</text>`;
  } else if (clef === 'bass') {
    s += `<text x="${leftX + 4}" y="${topY + 2.95 * ls}" font-size="${ls * 3.7}px" font-family="Segoe UI Symbol, serif">&#119074;</text>`;
  }
  return { svg: s, leftX, rightX };
}

// Rhythm symbol drawing on a single rhythm line or staff middle line
function drawRhythmSymSVG(sym, x, y, color = '#000') {
  let s = '';
  if (sym === 'w') {
    s += `<ellipse cx="${x}" cy="${y}" rx="6.2" ry="4.2" fill="${color}"/>`;
    s += `<ellipse cx="${x}" cy="${y}" rx="3.4" ry="2.2" transform="rotate(-20 ${x} ${y})" fill="#fff"/>`;
  } else if (sym === 'h' || sym === 'hd' || sym === 'hdd') {
    s += `<ellipse cx="${x}" cy="${y}" rx="5.4" ry="3.8" transform="rotate(-20 ${x} ${y})" fill="#fff" stroke="${color}" stroke-width="1.35"/>`;
    s += `<line x1="${x + 4.8}" y1="${y}" x2="${x + 4.8}" y2="${y - 25}" stroke="${color}" stroke-width="1.25"/>`;
    if (sym === 'hd' || sym === 'hdd') s += `<circle cx="${x + 10}" cy="${y - 1}" r="1.8" fill="${color}"/>`;
    if (sym === 'hdd') s += `<circle cx="${x + 15}" cy="${y - 1}" r="1.8" fill="${color}"/>`;
  } else if (sym === 'q' || sym === 'qd') {
    s += `<ellipse cx="${x}" cy="${y}" rx="5.4" ry="3.8" transform="rotate(-20 ${x} ${y})" fill="${color}"/>`;
    s += `<line x1="${x + 4.8}" y1="${y}" x2="${x + 4.8}" y2="${y - 25}" stroke="${color}" stroke-width="1.25"/>`;
    if (sym === 'qd') s += `<circle cx="${x + 10}" cy="${y - 1}" r="1.8" fill="${color}"/>`;
  } else if (sym === '8' || sym === '8d') {
    s += `<ellipse cx="${x}" cy="${y}" rx="5.2" ry="3.6" transform="rotate(-20 ${x} ${y})" fill="${color}"/>`;
    s += `<line x1="${x + 4.6}" y1="${y}" x2="${x + 4.6}" y2="${y - 25}" stroke="${color}" stroke-width="1.25"/>`;
    s += `<path d="M ${x + 4.6} ${y - 25} Q ${x + 13} ${y - 19} ${x + 10} ${y - 10}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    if (sym === '8d') s += `<circle cx="${x + 10}" cy="${y - 1}" r="1.8" fill="${color}"/>`;
  } else if (sym === '16') {
    s += `<ellipse cx="${x}" cy="${y}" rx="5.0" ry="3.5" transform="rotate(-20 ${x} ${y})" fill="${color}"/>`;
    s += `<line x1="${x + 4.5}" y1="${y}" x2="${x + 4.5}" y2="${y - 25}" stroke="${color}" stroke-width="1.25"/>`;
    s += `<path d="M ${x + 4.5} ${y - 25} Q ${x + 12} ${y - 20} ${x + 9.5} ${y - 13}" fill="none" stroke="${color}" stroke-width="1.4"/>`;
    s += `<path d="M ${x + 4.5} ${y - 19} Q ${x + 12} ${y - 14} ${x + 9.5} ${y - 7}" fill="none" stroke="${color}" stroke-width="1.4"/>`;
  } else if (sym === '88' || sym === '1616' || sym === '32_32') {
    const x2 = x + 15;
    s += `<ellipse cx="${x}" cy="${y}" rx="4.8" ry="3.4" transform="rotate(-20 ${x} ${y})" fill="${color}"/>`;
    s += `<ellipse cx="${x2}" cy="${y}" rx="4.8" ry="3.4" transform="rotate(-20 ${x2} ${y})" fill="${color}"/>`;
    s += `<line x1="${x + 4.3}" y1="${y}" x2="${x + 4.3}" y2="${y - 24}" stroke="${color}" stroke-width="1.2"/>`;
    s += `<line x1="${x2 + 4.3}" y1="${y}" x2="${x2 + 4.3}" y2="${y - 24}" stroke="${color}" stroke-width="1.2"/>`;
    s += `<line x1="${x + 3.8}" y1="${y - 24}" x2="${x2 + 4.8}" y2="${y - 24}" stroke="${color}" stroke-width="2.8"/>`;
    if (sym === '1616' || sym === '32_32') {
      s += `<line x1="${x + 3.8}" y1="${y - 19}" x2="${x2 + 4.8}" y2="${y - 19}" stroke="${color}" stroke-width="2.6"/>`;
    }
    if (sym === '32_32') {
      s += `<line x1="${x + 3.8}" y1="${y - 14}" x2="${x2 + 4.8}" y2="${y - 14}" stroke="${color}" stroke-width="2.4"/>`;
    }
  } else if (sym === '888' || sym === '8t' || sym === '16t') {
    const x2 = x + 13, x3 = x + 26;
    [x, x2, x3].forEach(nx => {
      s += `<ellipse cx="${nx}" cy="${y}" rx="4.6" ry="3.3" transform="rotate(-20 ${nx} ${y})" fill="${color}"/>`;
      s += `<line x1="${nx + 4.1}" y1="${y}" x2="${nx + 4.1}" y2="${y - 24}" stroke="${color}" stroke-width="1.15"/>`;
    });
    s += `<line x1="${x + 3.6}" y1="${y - 24}" x2="${x3 + 4.6}" y2="${y - 24}" stroke="${color}" stroke-width="2.8"/>`;
    if (sym === '16t') {
      s += `<line x1="${x + 3.6}" y1="${y - 19}" x2="${x3 + 4.6}" y2="${y - 19}" stroke="${color}" stroke-width="2.6"/>`;
    }
    if (sym === '8t' || sym === '16t') {
      s += `<text x="${x2 + 4}" y="${y - 27}" text-anchor="middle" font-size="10.5px" font-weight="bold" font-style="italic" fill="${color}">3</text>`;
    }
  } else if (sym === '8888' || sym === '16x4') {
    for (let k = 0; k < 4; k++) {
      const nx = x + k * 11;
      s += `<ellipse cx="${nx}" cy="${y}" rx="4.3" ry="3.1" transform="rotate(-20 ${nx} ${y})" fill="${color}"/>`;
      s += `<line x1="${nx + 3.9}" y1="${y}" x2="${nx + 3.9}" y2="${y - 24}" stroke="${color}" stroke-width="1.1"/>`;
    }
    s += `<line x1="${x + 3.5}" y1="${y - 24}" x2="${x + 33 + 4.3}" y2="${y - 24}" stroke="${color}" stroke-width="2.6"/>`;
    if (sym === '16x4') {
      s += `<line x1="${x + 3.5}" y1="${y - 19}" x2="${x + 33 + 4.3}" y2="${y - 19}" stroke="${color}" stroke-width="2.6"/>`;
    }
  } else if (sym === '8_16x4') {
    for (let k = 0; k < 5; k++) {
      const nx = x + k * 10;
      s += `<ellipse cx="${nx}" cy="${y}" rx="4.1" ry="3.0" transform="rotate(-20 ${nx} ${y})" fill="${color}"/>`;
      s += `<line x1="${nx + 3.7}" y1="${y}" x2="${nx + 3.7}" y2="${y - 24}" stroke="${color}" stroke-width="1.05"/>`;
    }
    s += `<line x1="${x + 3.3}" y1="${y - 24}" x2="${x + 40 + 4.1}" y2="${y - 24}" stroke="${color}" stroke-width="2.5"/>`;
    s += `<line x1="${x + 10 + 3.3}" y1="${y - 19}" x2="${x + 40 + 4.1}" y2="${y - 19}" stroke="${color}" stroke-width="2.5"/>`;
  } else if (sym === '8_1616' || sym === '1616_8' || sym === '8d_16_8' || sym === '8d_1616' || sym === '32_32_16' || sym === '16d_32_8') {
    const x2 = x + 13, x3 = x + 24;
    [x, x2, x3].forEach(nx => {
      s += `<ellipse cx="${nx}" cy="${y}" rx="4.5" ry="3.2" transform="rotate(-20 ${nx} ${y})" fill="${color}"/>`;
      s += `<line x1="${nx + 4.0}" y1="${y}" x2="${nx + 4.0}" y2="${y - 24}" stroke="${color}" stroke-width="1.15"/>`;
    });
    s += `<line x1="${x + 3.5}" y1="${y - 24}" x2="${x3 + 4.4}" y2="${y - 24}" stroke="${color}" stroke-width="2.7"/>`;
    if (sym === '8_1616' || sym === '8d_1616') {
      s += `<line x1="${x2 + 3.5}" y1="${y - 19}" x2="${x3 + 4.4}" y2="${y - 19}" stroke="${color}" stroke-width="2.6"/>`;
      if (sym === '8d_1616') s += `<circle cx="${x + 8}" cy="${y - 1}" r="1.5" fill="${color}"/>`;
    } else if (sym === '1616_8') {
      s += `<line x1="${x + 3.5}" y1="${y - 19}" x2="${x2 + 4.4}" y2="${y - 19}" stroke="${color}" stroke-width="2.6"/>`;
    } else if (sym === '8d_16_8') {
      s += `<circle cx="${x + 8}" cy="${y - 1}" r="1.5" fill="${color}"/>`;
      s += `<line x1="${x2 - 3}" y1="${y - 19}" x2="${x2 + 4.4}" y2="${y - 19}" stroke="${color}" stroke-width="2.6"/>`;
    } else if (sym === '32_32_16') {
      s += `<line x1="${x + 3.5}" y1="${y - 19}" x2="${x3 + 4.4}" y2="${y - 19}" stroke="${color}" stroke-width="2.5"/>`;
      s += `<line x1="${x + 3.5}" y1="${y - 14}" x2="${x2 + 4.4}" y2="${y - 14}" stroke="${color}" stroke-width="2.4"/>`;
    } else if (sym === '16d_32_8') {
      s += `<circle cx="${x + 8}" cy="${y - 1}" r="1.5" fill="${color}"/>`;
      s += `<line x1="${x + 3.5}" y1="${y - 19}" x2="${x2 + 4.4}" y2="${y - 19}" stroke="${color}" stroke-width="2.5"/>`;
      s += `<line x1="${x2 - 3}" y1="${y - 14}" x2="${x2 + 4.4}" y2="${y - 14}" stroke="${color}" stroke-width="2.4"/>`;
    }
  } else if (sym === '32x4_1616' || sym === '32x4_16') {
    const count = sym === '32x4_1616' ? 6 : 5;
    for (let k = 0; k < count; k++) {
      const nx = x + k * 8.5;
      s += `<ellipse cx="${nx}" cy="${y}" rx="3.8" ry="2.8" transform="rotate(-20 ${nx} ${y})" fill="${color}"/>`;
      s += `<line x1="${nx + 3.4}" y1="${y}" x2="${nx + 3.4}" y2="${y - 24}" stroke="${color}" stroke-width="1.0"/>`;
    }
    const lastX = x + (count - 1) * 8.5 + 3.8;
    s += `<line x1="${x + 3}" y1="${y - 24}" x2="${lastX}" y2="${y - 24}" stroke="${color}" stroke-width="2.4"/>`;
    s += `<line x1="${x + 3}" y1="${y - 19}" x2="${lastX}" y2="${y - 19}" stroke="${color}" stroke-width="2.4"/>`;
    s += `<line x1="${x + 3}" y1="${y - 14}" x2="${x + 3 * 8.5 + 3.8}" y2="${y - 14}" stroke="${color}" stroke-width="2.3"/>`;
  } else if (sym === '8d_16') {
    const x2 = x + 18;
    s += `<ellipse cx="${x}" cy="${y}" rx="4.8" ry="3.5" transform="rotate(-20 ${x} ${y})" fill="${color}"/>`;
    s += `<circle cx="${x + 8.5}" cy="${y - 1}" r="1.6" fill="${color}"/>`;
    s += `<ellipse cx="${x2}" cy="${y}" rx="4.8" ry="3.5" transform="rotate(-20 ${x2} ${y})" fill="${color}"/>`;
    s += `<line x1="${x + 4.3}" y1="${y}" x2="${x + 4.3}" y2="${y - 24}" stroke="${color}" stroke-width="1.15"/>`;
    s += `<line x1="${x2 + 4.3}" y1="${y}" x2="${x2 + 4.3}" y2="${y - 24}" stroke="${color}" stroke-width="1.15"/>`;
    s += `<line x1="${x + 3.8}" y1="${y - 24}" x2="${x2 + 4.8}" y2="${y - 24}" stroke="${color}" stroke-width="2.8"/>`;
    s += `<line x1="${x2 - 3}" y1="${y - 19}" x2="${x2 + 4.8}" y2="${y - 19}" stroke="${color}" stroke-width="2.8"/>`;
  } else if (sym === 'qr' || sym === 'qdr') {
    s += `<path d="M ${x - 2} ${y - 11} L ${x + 3} ${y - 5} L ${x - 2} ${y} L ${x + 3} ${y + 5} C ${x - 3} ${y + 6}, ${x - 3} ${y + 11}, ${x + 1} ${y + 12}" fill="none" stroke="${color}" stroke-width="1.9" stroke-linecap="round"/>`;
    if (sym === 'qdr') s += `<circle cx="${x + 7}" cy="${y - 2}" r="1.8" fill="${color}"/>`;
  } else if (sym === 'hr' || sym === 'hdr') {
    s += `<rect x="${x - 6}" y="${y - 5.5}" width="12" height="5.5" fill="${color}"/>`;
    s += `<line x1="${x - 9}" y1="${y}" x2="${x + 9}" y2="${y}" stroke="${color}" stroke-width="1.1"/>`;
    if (sym === 'hdr') s += `<circle cx="${x + 10}" cy="${y - 3}" r="1.8" fill="${color}"/>`;
  } else if (sym === 'wr') {
    s += `<rect x="${x - 6}" y="${y - 8}" width="12" height="5.5" fill="${color}"/>`;
    s += `<line x1="${x - 9}" y1="${y - 8}" x2="${x + 9}" y2="${y - 8}" stroke="${color}" stroke-width="1.1"/>`;
  } else if (sym === '8r' || sym === '8dr') {
    s += `<circle cx="${x - 1.5}" cy="${y - 4}" r="2.1" fill="${color}"/>`;
    s += `<path d="M ${x - 1} ${y - 4} Q ${x + 3} ${y - 5} ${x + 3.5} ${y - 8} L ${x - 1.5} ${y + 8}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    if (sym === '8dr') s += `<circle cx="${x + 6.5}" cy="${y - 4}" r="1.6" fill="${color}"/>`;
  } else if (sym === '16r') {
    s += `<circle cx="${x - 1}" cy="${y - 6}" r="1.9" fill="${color}"/>`;
    s += `<circle cx="${x - 2.5}" cy="${y}" r="1.9" fill="${color}"/>`;
    s += `<line x1="${x + 3.5}" y1="${y - 9}" x2="${x - 2.5}" y2="${y + 9}" stroke="${color}" stroke-width="1.4"/>`;
  }
  return s;
}

function rhythmAdvanceX(sym) {
  if (sym === '32x4_1616' || sym === '8_16x4') return 52;
  if (sym === '16x4' || sym === '8888' || sym === '32x4_16') return 46;
  if (sym === '888' || sym === '8t' || sym === '16t') return 38;
  if (sym === '8_1616' || sym === '1616_8' || sym === '8d_16_8' || sym === '8d_1616' || sym === '32_32_16' || sym === '16d_32_8') return 35;
  if (sym === '88' || sym === '8d_16' || sym === '1616' || sym === '32_32') return 28;
  return 21;
}
