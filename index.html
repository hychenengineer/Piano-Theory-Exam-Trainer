  const width = 680;
  if (scoreType === 'L1_OFFICIAL' || scoreType === 'L1_MOCK') {
    const topY = 24, bassY = 82, ls = 8.2, h = 132;
    let { svg, leftX, rightX } = drawGrandStaffBaseSVG(width, topY, bassY, ls, true);
    const isMock = (scoreType === 'L1_MOCK');
    const ts = isMock ? [4, 4] : [3, 4];
    svg += `<text x="${leftX + 38}" y="${topY - 7}" font-size="13.5" font-weight="bold" font-family="serif">${isMock ? 'Moderato' : 'Allegro'}</text>`;
    svg += drawTimeSigOnStaffSVG(ts, leftX + 42, topY, ls);
    svg += drawTimeSigOnStaffSVG(ts, leftX + 42, bassY, ls);

    const startX = leftX + 60;
    const numMeas = isMock ? 4 : 5;
    const measW = (rightX - startX - 8) / numMeas;
    for (let m = 1; m < numMeas; m++) {
      const bx = startX + m * measW;
      svg += `<line x1="${bx}" y1="${topY}" x2="${bx}" y2="${bassY + 4 * ls}" stroke="#000" stroke-width="0.95"/>`;
    }
    svg += `<text x="${startX + 8}" y="${topY + 4 * ls + 22}" font-size="14" font-weight="bold" font-style="italic" font-family="serif">${isMock ? 'f' : 'mf'}</text>`;

    if (!isMock) {
      // Official Level 1 Q8 5-measure piece in 3/4
      for (let m = 0; m < 5; m++) {
        const mLeft = startX + m * measW;
        svg += `<text x="${mLeft + 4}" y="${topY - 4}" font-size="9.5" font-style="italic">${m + 1}</text>`;
        if (m === 0) {
          svg += drawPitchedNoteSVG(mLeft + 22, getNoteY('treble', 0, topY, bassY, ls), 'q', 'up', '', '#000', { staccato: true });
          svg += drawLedgerLinesSVG('treble', 0, mLeft + 22, topY, bassY, ls);
          svg += drawPitchedNoteSVG(mLeft + 54, getNoteY('treble', 2, topY, bassY, ls), 'q', 'up', '', '#000', { staccato: true });
          svg += drawPitchedNoteSVG(mLeft + 86, getNoteY('treble', 4, topY, bassY, ls), 'q', 'up', '#', '#000', { staccato: true });
        } else if (m === 1) {
          svg += drawPitchedNoteSVG(mLeft + 24, getNoteY('treble', 4, topY, bassY, ls), 'h', 'up', 'n', '#000');
          svg += drawPitchedNoteSVG(mLeft + 74, getNoteY('treble', 2, topY, bassY, ls), 'q', 'up', '', '#000');
          svg += `<path d="M ${mLeft + 24} ${topY + 40} Q ${mLeft + 50} ${topY + 50} ${mLeft + 74} ${topY + 40}" fill="none" stroke="#000" stroke-width="1.2"/>`;
        } else if (m === 2) {
          svg += drawPitchedNoteSVG(mLeft + 24, getNoteY('bass', -2, topY, bassY, ls), 'q', 'down', '', '#000');
          svg += drawPitchedNoteSVG(mLeft + 56, getNoteY('bass', -3, topY, bassY, ls), 'q', 'down', '', '#000');
          svg += drawPitchedNoteSVG(mLeft + 88, getNoteY('bass', -4, topY, bassY, ls), 'q', 'down', '', '#000');
        } else if (m === 3) {
          svg += `<text x="${mLeft + 8}" y="${topY + 4 * ls + 22}" font-size="12" font-style="italic" font-family="serif">ritardando</text>`;
          svg += drawPitchedNoteSVG(mLeft + 24, getNoteY('bass', -5, topY, bassY, ls), 'h', 'down', '', '#000');
          svg += drawPitchedNoteSVG(mLeft + 76, getNoteY('bass', -6, topY, bassY, ls), 'q', 'down', '', '#000');
        } else if (m === 4) {
          svg += drawPitchedNoteSVG(mLeft + 34, getNoteY('bass', -7, topY, bassY, ls), 'hd', 'down', '', '#000');
        }
      }
    } else {
      const m1x = startX + 24;
      svg += drawPitchedNoteSVG(m1x, getNoteY('treble', 4, topY, bassY, ls), 'q', 'up', 'b', '#000', { staccato: true });
      svg += drawPitchedNoteSVG(m1x + 38, getNoteY('treble', 5, topY, bassY, ls), 'q', 'up', '', '#000', { staccato: true });
      svg += drawPitchedNoteSVG(m1x + 76, getNoteY('treble', 6, topY, bassY, ls), 'h', 'down', '', '#000');
      const m2x = startX + measW + 24;
      svg += drawPitchedNoteSVG(m2x, getNoteY('treble', 4, topY, bassY, ls), 'q', 'up', 'n', '#000');
      svg += drawRhythmSymSVG('88', m2x + 38, getNoteY('treble', 5, topY, bassY, ls), '#000');
      svg += `<path d="M ${m2x} ${topY + 38} Q ${m2x + 36} ${topY + 50} ${m2x + 68} ${topY + 38}" fill="none" stroke="#000" stroke-width="1.2"/>`;
      svg += drawPitchedNoteSVG(m2x + 86, getNoteY('treble', 4, topY, bassY, ls), 'q', 'up', '', '#000');
      const m3x = startX + 2 * measW + 24;
      svg += drawPitchedNoteSVG(m3x, getNoteY('bass', -4, topY, bassY, ls), 'h', 'down', '', '#000');
      svg += drawPitchedNoteSVG(m3x + 64, getNoteY('bass', -3, topY, bassY, ls), 'h', 'down', '', '#000');
      svg += `<text x="${m3x + 10}" y="${topY + 4 * ls + 22}" font-size="12.5" font-style="italic" font-family="serif">ritardando</text>`;
      const m4x = startX + 3 * measW + 24;
      svg += `<text x="${m4x - 6}" y="${topY + 4 * ls + 22}" font-size="12.5" font-style="italic" font-family="serif">p</text>`;
      svg += drawPitchedNoteSVG(m4x + 28, getNoteY('treble', 0, topY, bassY, ls), 'w', 'up', '', '#000');
      svg += drawLedgerLinesSVG('treble', 0, m4x + 28, topY, bassY, ls);
      svg += `<circle cx="${rightX - 10}" cy="${topY + 1.5 * ls}" r="1.8" fill="#000"/><circle cx="${rightX - 10}" cy="${topY + 2.5 * ls}" r="1.8" fill="#000"/>`;
      svg += `<circle cx="${rightX - 10}" cy="${bassY + 1.5 * ls}" r="1.8" fill="#000"/><circle cx="${rightX - 10}" cy="${bassY + 2.5 * ls}" r="1.8" fill="#000"/>`;
    }
    return `<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
  }

  if (scoreType === 'L2_OFFICIAL' || scoreType === 'L2_MOCK') {
    // 2-system, 8-measure Grand Staff piece for Level 2 Q7
    const isMock = (scoreType === 'L2_MOCK');
    const accType = isMock ? 'b' : '#';
    const tempo = isMock ? 'Andante' : 'Moderato';
    let out = '';
    for (let sys = 0; sys < 2; sys++) {
      const topY = 20, bassY = 72, ls = 7.8, h = 114;
      let { svg, leftX, rightX } = drawGrandStaffBaseSVG(width, topY, bassY, ls, sys === 1);
      svg += drawKeySigOnStaffSVG('treble', accType, 1, leftX + 34, topY, ls);
      svg += drawKeySigOnStaffSVG('bass', accType, 1, leftX + 34, bassY, ls);
      if (sys === 0) {
        svg += `<text x="${leftX + 34}" y="${topY - 5}" font-size="13" font-weight="bold" font-family="serif">${tempo}</text>`;
        svg += drawTimeSigOnStaffSVG([4, 4], leftX + 54, topY, ls);
        svg += drawTimeSigOnStaffSVG([4, 4], leftX + 54, bassY, ls);
      }
      const startX = sys === 0 ? leftX + 72 : leftX + 52;
      const measW = (rightX - startX - 6) / 4;
      for (let m = 0; m < 4; m++) {
        const mNum = sys * 4 + m + 1;
        const mLeft = startX + m * measW;
        if (m > 0) svg += `<line x1="${mLeft}" y1="${topY}" x2="${mLeft}" y2="${bassY + 4 * ls}" stroke="#000" stroke-width="0.9"/>`;
        svg += `<text x="${mLeft + 4}" y="${topY - 4}" font-size="9.5" font-style="italic">${mNum}</text>`;
        const midY = topY + 4 * ls + 18;
        if (mNum === 1) {
          svg += `<text x="${mLeft + 10}" y="${midY}" font-size="13" font-weight="bold" font-style="italic">mf</text>`;
          svg += drawPitchedNoteSVG(mLeft + 24, getNoteY('treble', 4, topY, bassY, ls), 'q', 'up', '');
          svg += drawPitchedNoteSVG(mLeft + 52, getNoteY('treble', 5, topY, bassY, ls), 'q', 'up', '');
          svg += drawPitchedNoteSVG(mLeft + 80, getNoteY('treble', 6, topY, bassY, ls), 'q', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 108, getNoteY('treble', 7, topY, bassY, ls), 'q', 'down', '');
          svg += `<path d="M ${mLeft + 24} ${topY + 34} Q ${mLeft + 38} ${topY + 42} ${mLeft + 52} ${topY + 32}" fill="none" stroke="#000" stroke-width="1.1"/>`;
          svg += `<path d="M ${mLeft + 80} ${topY + 8} Q ${mLeft + 94} ${topY} ${mLeft + 108} ${topY + 6}" fill="none" stroke="#000" stroke-width="1.1"/>`;
        } else if (mNum === 2) {
          svg += drawPitchedNoteSVG(mLeft + 24, getNoteY('treble', 8, topY, bassY, ls), 'h', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 74, getNoteY('treble', 6, topY, bassY, ls), 'h', 'down', '');
          svg += `<path d="M ${mLeft + 24} ${topY + 5} Q ${mLeft + 49} ${topY - 4} ${mLeft + 74} ${topY + 8}" fill="none" stroke="#000" stroke-width="1.1"/>`;
        } else if (mNum === 3) {
          svg += `<text x="${mLeft + 10}" y="${midY}" font-size="11.5" font-style="italic">accelerando</text>`;
          svg += drawPitchedNoteSVG(mLeft + 24, getNoteY('bass', -5, topY, bassY, ls), 'q', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 54, getNoteY('bass', -4, topY, bassY, ls), 'q', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 84, getNoteY('bass', -3, topY, bassY, ls), 'h', 'down', '');
          svg += `<path d="M ${mLeft + 24} ${bassY + 6} Q ${mLeft + 39} ${bassY - 2} ${mLeft + 54} ${bassY + 4}" fill="none" stroke="#000" stroke-width="1.1"/>`;
          svg += `<path d="M ${mLeft + 54} ${bassY + 4} Q ${mLeft + 69} ${bassY - 4} ${mLeft + 84} ${bassY + 2}" fill="none" stroke="#000" stroke-width="1.1"/>`;
        } else if (mNum === 4) {
          svg += `<text x="${mLeft + 10}" y="${midY}" font-size="13.5" font-weight="bold" font-style="italic">f</text>`;
          svg += drawPitchedNoteSVG(mLeft + 28, getNoteY('treble', 7, topY, bassY, ls), 'h', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 78, getNoteY('treble', 8, topY, bassY, ls), 'h', 'down', '');
          svg += `<path d="M ${mLeft + 28} ${topY + 6} Q ${mLeft + 53} ${topY - 4} ${mLeft + 78} ${topY + 4}" fill="none" stroke="#000" stroke-width="1.1"/>`;
        } else if (mNum === 5) {
          svg += `<text x="${mLeft + 10}" y="${midY}" font-size="11.5" font-style="italic">a tempo</text>`;
          svg += drawPitchedNoteSVG(mLeft + 26, getNoteY('treble', 8, topY, bassY, ls), 'q', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 56, getNoteY('treble', 7, topY, bassY, ls), 'q', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 86, getNoteY('treble', 6, topY, bassY, ls), 'h', 'down', '');
          svg += `<path d="M ${mLeft + 26} ${topY + 6} Q ${mLeft + 41} ${topY - 2} ${mLeft + 56} ${topY + 6}" fill="none" stroke="#000" stroke-width="1.1"/>`;
          svg += `<path d="M ${mLeft + 56} ${topY + 6} Q ${mLeft + 71} ${topY - 2} ${mLeft + 86} ${topY + 8}" fill="none" stroke="#000" stroke-width="1.1"/>`;
        } else if (mNum === 6) {
          svg += drawPitchedNoteSVG(mLeft + 26, getNoteY('bass', -6, topY, bassY, ls), 'h', 'down', '');
          svg += drawPitchedNoteSVG(mLeft + 78, getNoteY('bass', -7, topY, bassY, ls), 'h', 'down', '');
          svg += `<path d="M ${mLeft + 26} ${bassY + 10} Q ${mLeft + 52} ${bassY} ${mLeft + 78} ${bassY + 12}" fill="none" stroke="#000" stroke-width="1.1"/>`;
        } else if (mNum === 7) {
          svg += `<text x="${mLeft + 10}" y="${midY}" font-size="11.5" font-style="italic">ritardando</text>`;
          svg += drawPitchedNoteSVG(mLeft + 26, getNoteY('treble', 5, topY, bassY, ls), 'h', 'up', '', '#000', { accent: true });
          svg += drawPitchedNoteSVG(mLeft + 78, getNoteY('treble', 6, topY, bassY, ls), 'h', 'down', '');
          svg += `<path d="M ${mLeft + 26} ${topY + 34} Q ${mLeft + 52} ${topY + 44} ${mLeft + 78} ${topY + 30}" fill="none" stroke="#000" stroke-width="1.1"/>`;
        } else if (mNum === 8) {
          svg += `<text x="${mLeft + 10}" y="${midY}" font-size="13" font-weight="bold" font-style="italic">p</text>`;
          const endPos = isMock ? 3 : 4;
          svg += drawPitchedNoteSVG(mLeft + 46, getNoteY('treble', endPos, topY, bassY, ls), 'w', 'up', '');
        }
      }
      out += `<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
    }
    return out;
  }

  // L3_OFFICIAL / L3_MOCK: 2-system 8-measure piece in 3/4 with triplets and 13 ledger-line notes
  const isMock = (scoreType === 'L3_MOCK');
  const sharpCount = isMock ? 2 : 3; // D Major (2#) or A Major (3#)
  let out = '';
  for (let sys = 0; sys < 2; sys++) {
    const topY = 20, bassY = 72, ls = 7.8, h = 114;
    let { svg, leftX, rightX } = drawGrandStaffBaseSVG(width, topY, bassY, ls, sys === 1);
    svg += drawKeySigOnStaffSVG('treble', '#', sharpCount, leftX + 34, topY, ls);

    if (sys === 0) {
      svg += `<text x="${leftX + 34}" y="${topY - 5}" font-size="13" font-weight="bold" font-family="serif">Allegro molto</text>`;
      svg += drawTimeSigOnStaffSVG([3, 4], leftX + 70, topY, ls);
      svg += drawTimeSigOnStaffSVG([3, 4], leftX + 70, bassY, ls);
    }
    const startX = sys === 0 ? leftX + 86 : leftX + 66;
    const measW = (rightX - startX - 6) / 4;
    for (let m = 0; m < 4; m++) {
      const mNum = sys * 4 + m + 1;
      const mLeft = startX + m * measW;
      if (m > 0) svg += `<line x1="${mLeft}" y1="${topY}" x2="${mLeft}" y2="${bassY + 4 * ls}" stroke="#000" stroke-width="0.9"/>`;
      svg += `<text x="${mLeft + 4}" y="${topY - 4}" font-size="9.5" font-style="italic">${mNum}</text>`;
      const midY = topY + 4 * ls + 18;
      if (mNum === 1) {
        const startPos = isMock ? 1 : 5;
        svg += drawRhythmSymSVG('8t', mLeft + 18, getNoteY('treble', startPos, topY, bassY, ls), '#000');
        svg += drawPitchedNoteSVG(mLeft + 68, getNoteY('treble', startPos + 1, topY, bassY, ls), 'q', 'up', '');
        svg += drawPitchedNoteSVG(mLeft + 98, getNoteY('treble', startPos + 2, topY, bassY, ls), 'q', 'down', '');
      } else if (mNum === 2) {
        svg += drawRhythmSymSVG('8t', mLeft + 18, getNoteY('treble', 6, topY, bassY, ls), '#000');
        svg += drawPitchedNoteSVG(mLeft + 74, getNoteY('treble', 7, topY, bassY, ls), 'h', 'down', '');
      } else if (mNum === 3) {
        svg += drawPitchedNoteSVG(mLeft + 26, getNoteY('treble', 4, topY, bassY, ls), 'q', 'up', '');
        svg += drawPitchedNoteSVG(mLeft + 62, getNoteY('treble', 5, topY, bassY, ls), 'h', 'up', '');
      } else if (mNum === 4) {
        svg += drawPitchedNoteSVG(mLeft + 36, getNoteY('bass', -5, topY, bassY, ls), 'hd', 'down', '');
      } else if (mNum === 5) {
        // 5 ledger-line notes in m.5
        [12, 13, 12, 13, 12].forEach((p, idx) => {
          const nx = mLeft + 18 + idx * 21;
          svg += drawLedgerLinesSVG('treble', p, nx, topY, bassY, ls);
          svg += drawPitchedNoteSVG(nx, getNoteY('treble', p, topY, bassY, ls), idx < 4 ? '8' : 'q', 'down', '');
        });
      } else if (mNum === 6) {
        svg += `<text x="${mLeft + 8}" y="${midY}" font-size="11.5" font-style="italic">accelerando</text>`;
        // 5 ledger-line notes in m.6
        [0, -1, 0, -1, 0].forEach((p, idx) => {
          const nx = mLeft + 18 + idx * 21;
          svg += drawLedgerLinesSVG('treble', p, nx, topY, bassY, ls);
          svg += drawPitchedNoteSVG(nx, getNoteY('treble', p, topY, bassY, ls), idx < 4 ? '8' : 'q', 'up', '');
        });
      } else if (mNum === 7) {
        // 3 ledger-line notes in m.7 (5 + 5 + 3 = 13 ledger-line notes total!)
        [0, 1, 0].forEach((p, idx) => {
          const nx = mLeft + 22 + idx * 32;
          svg += drawLedgerLinesSVG('bass', p, nx, topY, bassY, ls);
          svg += drawPitchedNoteSVG(nx, getNoteY('bass', p, topY, bassY, ls), 'q', 'down', '');
        });
      } else if (mNum === 8) {
        const endPos = isMock ? 1 : 5;
        svg += drawPitchedNoteSVG(mLeft + 42, getNoteY('treble', endPos, topY, bassY, ls), 'hd', 'up', '');
      }
    }
    out += `<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
  }
  return out;
}

function renderScoreQuestionsBlock(q, isKey) {
  const scoreHtml = renderScoreExcerptSVG(q.scoreType);
  const itemsHtml = q.items.map(it => {
    if (it.kind === 'mc') {
      const optsHtml = it.opts.map((opt, oIdx) => {
        const isAns = (oIdx === it.ansIdx);
        const cls = (it.isExample && isAns)
          ? 'border:1.4px solid #000; border-radius:999px; padding:1px 7px; font-weight:bold;'
          : ((isKey && isAns) ? 'mc-circle-ans' : '');
        const styleAttr = (it.isExample && isAns) ? `style="${cls}"` : `class="${cls}"`;
        return `<span ${styleAttr}>${oIdx + 1}) ${opt}</span>`;
      }).join('<span style="display:inline-block;width:16px;"></span>');
      if (q.singleColumn) {
        return `<div style="margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline;"><div><b>${it.label}</b> ${it.prompt} ${it.isExample ? '<i>(example)</i>' : ''}</div><div style="margin-left:16px;">${optsHtml}</div></div>`;
      }
      return `<div style="margin-bottom:6px;"><b>${it.label}</b> ${it.prompt}<div style="margin-left:16px; margin-top:2px;">${optsHtml}</div></div>`;
    } else {
      const fill = it.isExample
        ? `<b>${it.ans}</b>`
        : (isKey ? `<span class="print-ans-text">${it.ans}</span>` : `&nbsp;`);
      return `<div style="margin-bottom:6px;"><b>${it.label}</b> ${it.prompt} <span class="print-underline" style="min-width:65px;">${fill}</span> ${it.suffix || ''} ${it.isExample ? '<i>(example)</i>' : ''}</div>`;
    }
  }).join('');

  const gridStyle = q.singleColumn
    ? 'display:block; margin-top:12px; font-size:13.5px;'
    : 'display:grid; grid-template-columns: 1fr 1fr; column-gap:22px; row-gap:4px; margin-top:10px; font-size:13.2px;';

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <div>${scoreHtml}</div>
      <div style="${gridStyle}">
        ${itemsHtml}
      </div>
    </div>
  `;
}

// 18. Single-Staff Row of Key Signatures (Level 4 Q5, Level 5 Q5, Level 7 Q6)
function renderKeySignaturesRowBlock(q, isKey) {
  const allItems = [q.exampleItem, ...q.items];
  const width = 680, topY = 18, ls = 8.2;
  const hasMinor = !!q.includeRelativeMinor;
  const svgH = hasMinor ? 108 : 88;
  let { svg, leftX, rightX } = drawSingleStaffBaseSVG(width, topY, ls, 'treble', true);
  const startX = leftX + 38;
  const measW = (rightX - startX - 6) / allItems.length;

  allItems.forEach((it, idx) => {
    const mLeft = startX + idx * measW;
    const midX = mLeft + measW / 2;
    if (idx > 0) {
      svg += `<line x1="${mLeft}" y1="${topY}" x2="${mLeft}" y2="${topY + 4 * ls}" stroke="#000" stroke-width="0.95"/>`;
    }
    const clefHere = it.clef || 'treble';
    if (idx > 0 && it.clef === 'bass' && allItems[idx - 1].clef !== 'bass') {
      svg += `<text x="${mLeft - 18}" y="${topY + 2.85 * ls}" font-size="${ls * 2.9}px" font-family="Segoe UI Symbol, serif">&#119074;</text>`;
    }
    const ksStartX = mLeft + 10;
    svg += drawKeySigOnStaffSVG(clefHere, it.accType, it.count, ksStartX, topY, ls);

    const y1 = topY + 4 * ls + 24;
    svg += `<line x1="${midX - 24}" y1="${y1}" x2="${midX + 24}" y2="${y1}" stroke="#000" stroke-width="0.95"/>`;
    if (idx === 0) {
      svg += `<text x="${midX - 28}" y="${y1 - 2}" text-anchor="end" font-size="10.5" font-style="italic">${hasMinor ? 'major:' : 'example:'}</text>`;
      svg += `<text x="${midX}" y="${y1 - 4}" text-anchor="middle" font-size="12.5" font-family="serif">${it.maj}</text>`;
    } else if (isKey) {
      svg += `<text x="${midX}" y="${y1 - 4}" text-anchor="middle" fill="#d00000" font-weight="bold" font-size="12.5" font-family="sans-serif">${it.maj}</text>`;
    }

    if (hasMinor) {
      const y2 = y1 + 20;
      svg += `<line x1="${midX - 24}" y1="${y2}" x2="${midX + 24}" y2="${y2}" stroke="#000" stroke-width="0.95"/>`;
      if (idx === 0) {
        svg += `<text x="${midX - 28}" y="${y2 - 2}" text-anchor="end" font-size="10.5" font-style="italic">minor:</text>`;
        svg += `<text x="${midX}" y="${y2 - 4}" text-anchor="middle" font-size="12.5" font-family="serif">${it.min}</text>`;
      } else if (isKey) {
        svg += `<text x="${midX}" y="${y2 - 4}" text-anchor="middle" fill="#d00000" font-weight="bold" font-size="12.5" font-family="sans-serif">${it.min}</text>`;
      }
    }
  });

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <svg width="${width}" height="${svgH}" viewBox="0 0 ${width} ${svgH}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
    </div>
  `;
}

// 19. Level 6 Q5: 2x3 Grid of Key Signatures (Relative Major & Minor)
function renderKeySignaturesGridBlock(q, isKey) {
  const cards = q.items.map((it, idx) => {
    const w = 205, topY = 14, ls = 7.8, h = 54;
    let { svg, leftX } = drawSingleStaffBaseSVG(w, topY, ls, it.clef, true);
    svg += drawKeySigOnStaffSVG(it.clef, it.accType, it.count, leftX + 34, topY, ls);
    const majFill = idx === 0 ? `<b>${it.maj}</b>` : (isKey ? `<span class="print-ans-text">${it.maj}</span>` : `&nbsp;`);
    const minFill = idx === 0 ? `<b>${it.min}</b>` : (isKey ? `<span class="print-ans-text">${it.min}</span>` : `&nbsp;`);
    return `
      <div style="text-align:center; font-size:12.8px;">
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
        <div style="margin-top:2px;">
          ${idx === 0 ? '<i>ex:</i> ' : ''}<span class="print-underline" style="min-width:34px;">${majFill}</span> Major or <span class="print-underline" style="min-width:34px;">${minFill}</span> minor

  return `

}

// 21. Two-Column Text Matching Block (Level 4 Q9, Level 8 Q9)
function renderTextMatchingBlock(q, isKey) {
  const leftHtml = q.leftItems.map(it => `

  return `

// 22. Multiple-Choice Terminology Questions List (Level 5 Q6, Level 6 Q8, Level 7 Q9, Level 8 Q10)
function renderMCQuestionsListBlock(q, isKey) {
  const rows = q.questions.map(item => {
    const optsHtml = item.opts.map((opt, oIdx) => {
      const isAns = (oIdx === item.ansIdx);
      const cls = (item.isExample && isAns)
        ? 'border:1.4px solid #000; border-radius:999px; padding:1px 7px; font-weight:bold;'
        : ((isKey && isAns) ? 'border:1.8px solid #d00000; border-radius:999px; padding:1px 7px; color:#d00000; font-weight:bold;' : '');
      return `<span style="${cls}">(${oIdx + 1}) ${opt}</span>`;
    }).join('<span style="display:inline-block;width:16px;"></span>');

    return `
      <div style="margin-bottom:6px; font-size:13.4px; display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
        <div><b>${item.letter}.</b> ${item.prompt} ${item.isExample ? '<i>(example)</i>' : ''}</div>
        <div style="white-space:nowrap;">${optsHtml}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <div style="margin-top:6px;">${rows}</div>
    </div>
  `;
}

// 23. Level 5 Q7: Minor Scale Identification (Tonic Note + Natural / Harmonic / Melodic)
function renderMinorScaleIdentificationBlock(q, isKey) {
  const stavesHtml = q.scales.map((sc, idx) => {
    const width = 680, topY = 14, ls = 8.0, h = 56;
    let { svg, leftX, rightX } = drawSingleStaffBaseSVG(width, topY, ls, sc.clef, true);
    if (sc.accCount > 0) {
      svg += drawKeySigOnStaffSVG(sc.clef, sc.accType, sc.accCount, leftX + 34, topY, ls);
    }
    const startX = leftX + 46 + (sc.accCount || 0) * 10;
    const stepX = (rightX - startX - 24) / Math.max(1, sc.notes.length - 1);
    sc.notes.forEach((n, nIdx) => {
      const nx = startX + nIdx * stepX;
      const ny = getNoteY(sc.clef, n.pos, topY, topY, ls);
      svg += drawLedgerLinesSVG(sc.clef, n.pos, nx, topY, topY, ls);
      svg += drawWholeNoteSVG(nx, ny, n.acc || '');
    });

    const isEx = idx === 0;
    const tonicVal = isEx ? `<b>${sc.tonic}</b>` : (isKey ? `<span class="print-ans-text">${sc.tonic}</span>` : `&nbsp;`);
    const forms = ['a) natural', 'b) harmonic', 'c) melodic'];
    const formsHtml = forms.map((fText, fIdx) => {
      const isCorrect = (fIdx === sc.formIdx);
      const style = (isEx && isCorrect)
        ? 'border:1.4px solid #000; border-radius:4px; padding:1px 8px; font-weight:bold;'
        : ((isKey && isCorrect) ? 'border:1.8px solid #d00000; border-radius:999px; padding:1px 8px; color:#d00000; font-weight:bold;' : '');
      return `<span style="${style}">${fText}</span>`;
    }).join('<span style="display:inline-block;width:22px;"></span>');

    return `
      <div style="margin-top:6px;">
        <svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:13.2px; margin-top:1px; padding:0 16px;">
          <div>${isEx ? '<i>example:</i> ' : ''}tonic note: <span class="print-underline" style="min-width:45px;">${tonicVal}</span></div>
          <div>${formsHtml}</div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      ${stavesHtml}
    </div>
  `;
}

// 24. Roman Numeral Analysis Block (Level 7 Q5, Level 8 Q8)
function renderRomanNumeralAnalysisBlock(q, isKey) {
  const systems = q.systems || [q.measures];
  const width = 680, topY = 18, bassY = 74, ls = 8.0, sysH = 144;
  let chordIdxGlobal = 0;

  const sysSvgs = systems.map((measures, sysIdx) => {
    const isFinalSys = sysIdx === systems.length - 1;
    let { svg, leftX, rightX } = drawGrandStaffBaseSVG(width, topY, bassY, ls, isFinalSys);
    if (!isFinalSys) {
      svg += `<line x1="${rightX}" y1="${topY}" x2="${rightX}" y2="${bassY + 4 * ls}" stroke="#000" stroke-width="1.1"/>`;
    }
    svg += drawKeySigOnStaffSVG('treble', q.keySig.accType, q.keySig.count, leftX + 34, topY, ls);
    svg += drawKeySigOnStaffSVG('bass', q.keySig.accType, q.keySig.count, leftX + 34, bassY, ls);
    let startX = leftX + 44 + q.keySig.count * 10;
    if (sysIdx === 0 && q.timeSig) {
      svg += drawTimeSigOnStaffSVG(q.timeSig, startX, topY, ls);
      svg += drawTimeSigOnStaffSVG(q.timeSig, startX, bassY, ls);
      startX += 22;
    }

    const measW = (rightX - startX - 8) / measures.length;
    measures.forEach((m, mIdx) => {
      const mLeft = startX + mIdx * measW;
      if (mIdx > 0) {
        svg += `<line x1="${mLeft}" y1="${topY}" x2="${mLeft}" y2="${bassY + 4 * ls}" stroke="#000" stroke-width="0.95"/>`;
      }
      const stepX = (measW - 16) / m.chords.length;
      m.chords.forEach((ch, cIdx) => {
        const cx = mLeft + 16 + cIdx * stepX + stepX / 3;
        ch.treble.forEach((n, nIdx) => {
          const prevN = nIdx > 0 ? ch.treble[nIdx - 1] : null;
          const isSec = prevN && Math.abs(n.pos - prevN.pos) === 1;
          const nx = isSec ? cx + 9.5 : cx;
          const ny = getNoteY('treble', n.pos, topY, bassY, ls);
          svg += drawLedgerLinesSVG('treble', n.pos, nx, topY, bassY, ls);
          svg += drawPitchedNoteSVG(nx, ny, ch.dur, n.stemDir || 'up', n.acc || '');
        });
        ch.bass.forEach((n, nIdx) => {
          const prevN = nIdx > 0 ? ch.bass[nIdx - 1] : null;
          const isSec = prevN && Math.abs(n.pos - prevN.pos) === 1;
          const nx = isSec ? cx + 9.5 : cx;
          const ny = getNoteY('bass', n.pos, topY, bassY, ls);
          svg += drawLedgerLinesSVG('bass', n.pos, nx, topY, bassY, ls);
          svg += drawPitchedNoteSVG(nx, ny, ch.dur, n.stemDir || 'down', n.acc || '');
        });

        const lineY = bassY + 4 * ls + 26;
        svg += `<line x1="${cx - 17}" y1="${lineY}" x2="${cx + 17}" y2="${lineY}" stroke="#000" stroke-width="0.95"/>`;
        if (chordIdxGlobal === 0) {
          svg += `<text x="${cx}" y="${lineY - 4}" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="serif">ex: ${ch.rn}</text>`;
        } else if (isKey) {
          svg += `<text x="${cx}" y="${lineY - 4}" text-anchor="middle" fill="#d00000" font-weight="bold" font-size="12" font-family="sans-serif">${ch.rn}</text>`;
        }
        chordIdxGlobal++;
      });
    });

    return `<svg width="${width}" height="${sysH}" viewBox="0 0 ${width} ${sysH}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
  }).join('');

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      ${sysSvgs}
    </div>
  `;
}

// 25. Level 7 Q7: Parallel Major -> Parallel Minor Key Signature Writing
function renderParallelMinorKeySigBlock(q, isKey) {
  const width = 680, topY = 20, ls = 8.0, h = 92;
  let { svg, leftX, rightX } = drawSingleStaffBaseSVG(width, topY, ls, 'treble', true);
  const startX = leftX + 36;
  const pairW = (rightX - startX - 6) / q.pairs.length;

  q.pairs.forEach((p, idx) => {
    const pLeft = startX + idx * pairW;
    const midBar = pLeft + pairW / 2;
    if (idx > 0) {
      svg += `<line x1="${pLeft}" y1="${topY}" x2="${pLeft}" y2="${topY + 4 * ls}" stroke="#000" stroke-width="1.2"/>`;
    }
    svg += `<line x1="${midBar}" y1="${topY}" x2="${midBar}" y2="${topY + 4 * ls}" stroke="#000" stroke-width="0.9"/>`;
    svg += drawKeySigOnStaffSVG('treble', p.majAccType, p.majCount, pLeft + 6, topY, ls, '#000');
    const arrowX = midBar + pairW / 4;
    svg += `<line x1="${arrowX}" y1="${topY - 14}" x2="${arrowX}" y2="${topY - 3}" stroke="#000" stroke-width="1.0"/>`;
    svg += `<path d="M ${arrowX - 3} ${topY - 7} L ${arrowX} ${topY - 2} L ${arrowX + 3} ${topY - 7}" fill="none" stroke="#000" stroke-width="1.0"/>`;

    const isEx = idx === 0;
    if (isEx || isKey) {
      const col = isEx ? '#000' : '#d00000';
      if (p.minCount > 0) {
        svg += drawKeySigOnStaffSVG('treble', p.minAccType, p.minCount, midBar + 6, topY, ls, col);
      } else {
        svg += `<text x="${arrowX}" y="${topY + 2.4 * ls}" text-anchor="middle" font-size="10.5px" font-weight="bold" fill="${col}">(0♯/0♭)</text>`;
      }
    }

    const lineY = topY + 4 * ls + 26;
    const c1 = pLeft + pairW / 4;
    const c2 = midBar + pairW / 4;
    svg += `<line x1="${c1 - 26}" y1="${lineY}" x2="${c1 + 26}" y2="${lineY}" stroke="#000" stroke-width="0.95"/>`;
    svg += `<line x1="${c2 - 26}" y1="${lineY}" x2="${c2 + 26}" y2="${lineY}" stroke="#000" stroke-width="0.95"/>`;
    if (isEx) {
      svg += `<text x="${c1}" y="${lineY - 4}" text-anchor="middle" font-size="11.5">${p.majName}</text>`;
      svg += `<text x="${c2}" y="${lineY - 4}" text-anchor="middle" font-size="11.5">${p.minName}</text>`;
      svg += `<text x="${pLeft + pairW / 2}" y="${lineY + 13}" text-anchor="middle" font-size="10" font-style="italic">example</text>`;
    } else if (isKey) {
      svg += `<text x="${c1}" y="${lineY - 4}" text-anchor="middle" fill="#d00000" font-weight="bold" font-size="11.5" font-family="sans-serif">${p.majName}</text>`;
      svg += `<text x="${c2}" y="${lineY - 4}" text-anchor="middle" fill="#d00000" font-weight="bold" font-size="11.5" font-family="sans-serif">${p.minName}</text>`;
    }
  });

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
    </div>
  `;
}

// 26. Level 8 Q1: 2x3 Grid of 7th Chords Identification
function renderSeventhChordsGridBlock(q, isKey) {

    const w = 205, topY = 14, ls = 7.8, h = 64;
    let { svg, leftX } = drawSingleStaffBaseSVG(w, topY, ls, ch.clef, true);
    const cx = leftX + 86;
    ch.notes.forEach((n, nIdx) => {
      const prevN = nIdx > 0 ? ch.notes[nIdx - 1] : null;
      const isSec = prevN && Math.abs(n.pos - prevN.pos) === 1;
      const nx = isSec ? cx + 10.5 : cx;
      const ny = getNoteY(ch.clef, n.pos, topY, topY, ls);
      svg += drawLedgerLinesSVG(ch.clef, n.pos, nx, topY, topY, ls);
      svg += drawWholeNoteSVG(nx, ny, n.acc || '', '#000', isSec ? -26 : (nIdx % 2 === 1 ? -25 : -16));

// 27. Level 8 Q2: Construct 7th Chords on Single Staff (no internal barlines)
function renderSeventhChordsConstructionBlock(q, isKey) {
  const width = 680, topY = 18, ls = 8.2, h = 92;
  let { svg, leftX, rightX } = drawSingleStaffBaseSVG(width, topY, ls, 'treble', true);
  const startX = leftX + 42;
  const measW = (rightX - startX - 6) / q.items.length;

  q.items.forEach((it, idx) => {
    const mLeft = startX + idx * measW;
    const cx = mLeft + measW / 2;
    const isEx = idx === 0;
    if (isEx || isKey) {
      const col = isEx ? '#000' : '#d00000';
      it.notes.forEach((n, nIdx) => {
        const prevN = nIdx > 0 ? it.notes[nIdx - 1] : null;
        const isSec = prevN && Math.abs(n.pos - prevN.pos) === 1;
        const nx = isSec ? cx + 10.5 : cx;
        const ny = getNoteY('treble', n.pos, topY, topY, ls);
        svg += drawLedgerLinesSVG('treble', n.pos, nx, topY, topY, ls, col);
        svg += drawWholeNoteSVG(nx, ny, n.acc || '', col, isSec ? -26 : (nIdx % 2 === 1 ? -25 : -16));
      });
    }
    svg += `<text x="${cx}" y="${topY + 4 * ls + 22}" text-anchor="middle" font-size="12px" font-family="serif">${isEx ? 'ex: ' : ''}${it.label}</text>`;
  });

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
    </div>
  `;
}

// 28. Level 8 Q3: 2x2 Grid of Church Modes Construction (labels below each staff)
function renderModesConstructionGridBlock(q, isKey) {
  const cards = q.modes.map((m, idx) => {

    if (isEx || isKey) {
      const col = isEx ? '#000' : '#d00000';
      const startX = leftX + 42;
      const stepX = (rightX - startX - 18) / 7;
      m.notes.forEach((n, nIdx) => {
        const nx = startX + nIdx * stepX;

  `;
}

// 29. Level 8 Q4: 4 Cadences in a Row
function renderCadencesRowBlock(q, isKey) {
  const cards = q.cadences.map((cad, idx) => {
    const w = 162, topY = 14, bassY = 62, ls = 7.2, h = 100;
    let { svg, leftX } = drawGrandStaffBaseSVG(w, topY, bassY, ls, true);
    svg += drawKeySigOnStaffSVG('treble', cad.keySig.accType, cad.keySig.count, leftX + 26, topY, ls);
    svg += drawKeySigOnStaffSVG('bass', cad.keySig.accType, cad.keySig.count, leftX + 26, bassY, ls);
    let tsX = leftX + 34 + cad.keySig.count * 7;
    if (cad.timeSig) {
      svg += drawTimeSigOnStaffSVG(cad.timeSig, tsX, topY, ls);
      svg += drawTimeSigOnStaffSVG(cad.timeSig, tsX, bassY, ls);
      tsX += 18;
    }
    const x1 = Math.max(leftX + 68, tsX + 12), x2 = x1 + 38;
    [cad.c1, cad.c2].forEach((ch, cIdx) => {
      const cx = cIdx === 0 ? x1 : x2;
      const dur = ch.dur || 'h';
      ch.treble.forEach(p => {
        svg += drawLedgerLinesSVG('treble', p, cx, topY, bassY, ls);
        svg += drawPitchedNoteSVG(cx, getNoteY('treble', p, topY, bassY, ls), dur, 'up', '');
      });
      ch.bass.forEach(p => {
        svg += drawLedgerLinesSVG('bass', p, cx, topY, bassY, ls);
        svg += drawPitchedNoteSVG(cx, getNoteY('bass', p, topY, bassY, ls), dur, 'down', '');
      });
    });
    const isEx = idx === 0;
    const fill = isEx ? `<i>ex:</i> <b>${cad.ans}</b>` : `<span class="print-underline" style="min-width:95px;">${isKey ? `<span class="print-ans-text">${cad.ans}</span>` : '&nbsp;'}</span>`;
    return `
      <div style="text-align:center; font-size:12.5px;">
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
        <div style="margin-top:2px;">${fill}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; margin-top:4px;">${cards}</div>
    </div>
  `;
}

// 30. Level 8 Q5: Meter Identification (Simple/Compound & Duple/Triple/Quadruple)

// 31. Level 8 Q6: Boxed Non-Harmonic Tones (2x2 Grid)
function renderNonHarmonicTonesGridBlock(q, isKey) {
  const cards = q.items.map((it, idx) => {
    const w = 320, topY = 16, bassY = 66, ls = 7.5, h = 104;
    let { svg, leftX } = drawGrandStaffBaseSVG(w, topY, bassY, ls, true);
    const ks = it.keySig || { accType: '#', count: 0 };
    const ts = it.timeSig || [4, 4];
    svg += drawKeySigOnStaffSVG('treble', ks.accType, ks.count, leftX + 28, topY, ls);
    svg += drawKeySigOnStaffSVG('bass', ks.accType, ks.count, leftX + 28, bassY, ls);
    const tsX = leftX + 38 + ks.count * 8;
    svg += drawTimeSigOnStaffSVG(ts, tsX, topY, ls);
    svg += drawTimeSigOnStaffSVG(ts, tsX, bassY, ls);
    const startX = tsX + 24;
    it.melody.forEach((n, nIdx) => {
      const nx = startX + nIdx * 42;
      const ny = getNoteY('treble', n.pos, topY, bassY, ls);
      svg += drawLedgerLinesSVG('treble', n.pos, nx, topY, bassY, ls);
      svg += drawPitchedNoteSVG(nx, ny, n.dur, 'up', n.acc || '', '#000', { boxed: !!n.boxed });
      if (n.tiedToNext) {
        svg += `<path d="M ${nx + 4} ${ny + 6} Q ${nx + 21} ${ny + 14} ${nx + 38} ${ny + 6}" fill="none" stroke="#000" stroke-width="1.2"/>`;
      }
    });
    it.bass.forEach((b, bIdx) => {
      const bx = startX + (b.xOffset !== undefined ? b.xOffset : bIdx * 84);
      const positions = b.positions || [b.pos];
      positions.forEach(p => {
        const by = getNoteY('bass', p, topY, bassY, ls);
        svg += drawLedgerLinesSVG('bass', p, bx, topY, bassY, ls);
        svg += drawPitchedNoteSVG(bx, by, b.dur, 'down', b.acc || '');
      });
    });
    const isEx = idx === 0;
    const fill = isEx ? `<i>example:</i> <b>${it.ans}</b>` : `<span class="print-underline" style="min-width:130px;">${isKey ? `<span class="print-ans-text">${it.ans}</span>` : '&nbsp;'}</span>`;
    return `
      <div style="text-align:center; font-size:13px;">
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
        <div style="margin-top:2px;">${fill}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:4px;">${cards}</div>
    </div>
  `;
}

// 32. Level 8 Q7: Ornaments Identification (5 Staves)
function renderOrnamentsRowBlock(q, isKey) {
  const cards = q.items.map((it, idx) => {
    const w = 130, topY = 20, ls = 7.8, h = 66;
    const clef = it.clef || 'treble';
    let { svg, leftX } = drawSingleStaffBaseSVG(w, topY, ls, clef, true);
    if (it.timeSig) {
      svg += drawTimeSigOnStaffSVG(it.timeSig, leftX + 34, topY, ls);
    }
    const nx = leftX + (it.timeSig ? 68 : 62);
    const defaultPos = clef === 'bass' ? -6 : 4;
    const ny = getNoteY(clef, it.pos !== undefined ? it.pos : defaultPos, topY, topY, ls);

    if (it.ornType === 'mordent') {
      svg += `<path d="M ${nx - 11} ${topY - 4} L ${nx - 6} ${topY - 9} L ${nx - 1} ${topY - 4} L ${nx + 4} ${topY - 9} L ${nx + 9} ${topY - 4}" fill="none" stroke="#000" stroke-width="1.3"/>`;
      svg += `<line x1="${nx - 1}" y1="${topY - 12}" x2="${nx - 1}" y2="${topY - 1}" stroke="#000" stroke-width="1.2"/>`;
      svg += drawPitchedNoteSVG(nx, ny, 'q', 'up', '');
    } else if (it.ornType === 'trill') {
      svg += `<text x="${nx}" y="${topY - 4}" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" font-family="serif">tr</text>`;
      svg += drawPitchedNoteSVG(nx, ny, 'q', 'down', '');
    } else if (it.ornType === 'turn') {
      svg += `<path d="M ${nx - 9} ${topY - 6} C ${nx - 4} ${topY - 13}, ${nx + 4} ${topY}, ${nx + 9} ${topY - 7}" fill="none" stroke="#000" stroke-width="1.5"/>`;
      svg += drawPitchedNoteSVG(nx, ny, 'q', 'up', '');
      svg += drawPitchedNoteSVG(nx + 24, ny - ls, 'q', 'down', '');
    } else if (it.ornType === 'appoggiatura') {
      const gx = nx - 16, gy = ny - ls / 2;
      svg += `<ellipse cx="${gx}" cy="${gy}" rx="3.5" ry="2.5" transform="rotate(-20 ${gx} ${gy})" fill="#000"/>`;
      svg += `<line x1="${gx + 3}" y1="${gy}" x2="${gx + 3}" y2="${gy - 16}" stroke="#000" stroke-width="1.0"/>`;
      svg += `<path d="M ${gx + 3} ${gy - 16} Q ${gx + 9} ${gy - 12} ${gx + 7} ${gy - 6}" fill="none" stroke="#000" stroke-width="1.1"/>`;
      svg += `<path d="M ${gx} ${gy + 5} Q ${gx + 8} ${gy + 10} ${nx - 2} ${ny + 4}" fill="none" stroke="#000" stroke-width="1.0"/>`;
      svg += drawPitchedNoteSVG(nx, ny, 'q', 'up', '');
    } else if (it.ornType === 'grace_note') {
      const gx = nx - 16, gy = ny + ls / 2;
      svg += `<ellipse cx="${gx}" cy="${gy}" rx="3.5" ry="2.5" transform="rotate(-20 ${gx} ${gy})" fill="#000"/>`;
      svg += `<line x1="${gx + 3}" y1="${gy}" x2="${gx + 3}" y2="${gy - 16}" stroke="#000" stroke-width="1.0"/>`;
      svg += `<path d="M ${gx + 3} ${gy - 16} Q ${gx + 9} ${gy - 12} ${gx + 7} ${gy - 6}" fill="none" stroke="#000" stroke-width="1.1"/>`;
      svg += `<line x1="${gx - 2}" y1="${gy - 6}" x2="${gx + 9}" y2="${gy - 14}" stroke="#000" stroke-width="1.2"/>`;
      svg += drawPitchedNoteSVG(nx, ny, 'q', 'down', '');
    }

    const isEx = idx === 0;
    const fill = isEx ? `<i>ex:</i> <b>${it.ans}</b>` : `<span class="print-underline" style="min-width:85px;">${isKey ? `<span class="print-ans-text">${it.ans}</span>` : '&nbsp;'}</span>`;
    return `
      <div style="text-align:center; font-size:12px;">
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
        <div style="margin-top:2px;">${fill}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="print-q-block">
      <div class="print-q-text">${q.num}. ${q.prompt}</div>
      <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-top:4px;">${cards}</div>
    </div>
  `;
}

// ============================================================================
// GENERATE LEVEL 7 EXAM
// ============================================================================
function generateLevel7Exam(variant, rng) {
  const { shuffle } = rng;

  // Q1: 7 harmonic intervals (no internal measure barlines)
  const q1Pool = [
    { staff: 'treble', type: 'harmonic', pos1: 4, acc1: '', pos2: 7, acc2: '#' },   // Aug. 4th (G4-C#5)
    { staff: 'bass', type: 'harmonic', pos1: -9, acc1: '', pos2: -7, acc2: 'x' },   // Aug. 3rd (A2-C##3)
    { staff: 'treble', type: 'harmonic', pos1: 5, acc1: 'b', pos2: 9, acc2: '' },   // Aug. 5th (Ab4-E5)
    { staff: 'bass', type: 'harmonic', pos1: -7, acc1: '#', pos2: -6, acc2: '' },   // min. 2nd (C#3-D3)
    { staff: 'bass', type: 'harmonic', pos1: -5, acc1: '', pos2: 1, acc2: 'b' },    // dim. 7th (E3-Db4)
    { staff: 'treble', type: 'harmonic', pos1: 5, acc1: '', pos2: 10, acc2: '' },   // min. 6th (A4-F5)
    { staff: 'bass', type: 'harmonic', pos1: -8, acc1: '#', pos2: -4, acc2: '#' }   // dim. 5th (B#2-F#3)
  ].map(iv => Object.assign({}, iv, { ans: computeIntervalName(iv.pos1, iv.acc1, iv.pos2, iv.acc2, true) }));
  const q1 = {
    num: 1,
    prompt: 'Identify each interval, using Maj. for major, min. for minor, Per. for perfect, Aug. for augmented, dim. for diminished, and the numbers 2nd, 3rd, 4th etc.',
    useMeasureBars: false,
    exampleIv: { staff: 'bass', type: 'harmonic', pos1: -7, acc1: '', pos2: -1, acc2: 'b', ans: 'min. 7th' },
    intervals: variant === 'official' ? q1Pool : shuffle(q1Pool)
  };

  // Q2: Complete 5 intervals by adding a note above
  const q2Pool = [
    { staff: 'treble', pos1: 2, acc1: 'b', qual: 'Maj.', num: 7 },
    { staff: 'bass', pos1: -7, acc1: 'b', qual: 'min.', num: 6 },
    { staff: 'treble', pos1: 5, acc1: 'b', qual: 'Per.', num: 5 },
    { staff: 'bass', pos1: -10, acc1: 'b', qual: 'min.', num: 3 },
    { staff: 'treble', pos1: 0, acc1: '#', qual: 'dim.', num: 4 }
  ];
  const q2 = {
    num: 2,
    prompt: 'Complete each interval by adding a note above the given note. Be sure to use the correct accidental.',
    exampleItem: { staff: 'bass', pos1: -7, acc1: '', qual: 'Aug.', num: 6 },
    items: variant === 'official' ? q2Pool : shuffle(q2Pool)
  };

  // Q3: 5 triads total (1 example + 4 questions) with Root, Quality, and Inversion
  const q3Pool = [
    { staff: 'bass', rootName: 'F♯', qual: 'Maj.', inv: '1st', notes: [{ pos: -9, acc: '#' }, { pos: -7, acc: '#' }, { pos: -4, acc: '#' }] },
    { staff: 'treble', rootName: 'C', qual: 'min.', inv: '2nd', notes: [{ pos: 4, acc: '' }, { pos: 7, acc: '' }, { pos: 9, acc: 'b' }] },

    { staff: 'bass', rootName: 'D♯', qual: 'dim.', inv: '1st', notes: [{ pos: -4, acc: '#' }, { pos: -2, acc: '' }, { pos: 1, acc: '#' }] }
  ];
  const q3 = {
    num: 3,
    prompt: 'Identify the following triads with 1) root, 2) quality (Maj., min., Aug., dim.), and 3) inversion (root, 1st, 2nd).',
    stackedInversionBlanks: true,
    exampleTriad: { staff: 'treble', rootName: 'C', qual: 'dim.', inv: '1st', notes: [{ pos: 2, acc: 'b' }, { pos: 4, acc: 'b' }, { pos: 7, acc: '' }] },
    triads: variant === 'official' ? q3Pool : shuffle(q3Pool)
  };

  // Q4: Transpose 3-measure Grand Staff piece in 6/8 down a major third to F minor
  const q4 = {
    num: 4,
    prompt: 'Use the blank staves to transpose the following music down a major third to the key of <b>F minor</b>. Remember to include the new key signature and any accidentals.',
    singleTrebleStaff: false,
    targetCaption: 'F minor begins here',

        },
        {
          treble: [{ pos: 9, dur: '8' }, { dur: '16x4', positions: [10, 9, 8, 9] }, { pos: 7, dur: 'qd' }],
          bass: [{ dur: '888', positions: [-9, -2, -2] }, { dur: '888', positions: [-5, -3, -3] }]
        },
        {

          bass: [{ dur: '888', positions: [-7, -2, -2] }, { dur: '888', positions: [-5, -3, -2] }]
        }
      ]
    },
    target: {
      keySig: { accType: 'b', count: 4 }, timeSig: [6, 8],
      measures: [
        {
          treble: [{ dur: '888', positions: [3, 4, 3], slurred: true }, { pos: 5, dur: '8' }, { pos: 6, dur: '8' }, { dur: '88', positions: [5, 4] }],
          bass: [{ dur: '888', positions: [-11, -4, -4] }, { pos: -12, dur: 'qd', acc: 'n' }]

    footerTitle: 'Level 8, Piano, Practice',
    pages: [
      [ renderSeventhChordsGridBlock(q1, false), renderSeventhChordsConstructionBlock(q2, false), renderModesConstructionGridBlock(q3, false), renderCadencesRowBlock(q4, false) ],
      [ renderMeterIdentificationBlock(q5, false), renderNonHarmonicTonesGridBlock(q6, false), renderOrnamentsRowBlock(q7, false) ],
      [ renderRomanNumeralAnalysisBlock(q8, false), renderTextMatchingBlock(q9, false), renderMCQuestionsListBlock(q10, false) ]
    ],
    pagesKey: [
      [ renderSeventhChordsGridBlock(q1, true), renderSeventhChordsConstructionBlock(q2, true), renderModesConstructionGridBlock(q3, true), renderCadencesRowBlock(q4, true) ],
      [ renderMeterIdentificationBlock(q5, true), renderNonHarmonicTonesGridBlock(q6, true), renderOrnamentsRowBlock(q7, true) ],
      [ renderRomanNumeralAnalysisBlock(q8, true), renderTextMatchingBlock(q9, true), renderMCQuestionsListBlock(q10, true) ]
    ],
    raw: { q1, q2, q3, q4, q5, q6, q7, q8, q9, q10 }
  };
}

// ============================================================================
// MAIN EXAM BUILDER DISPATCHER
// ============================================================================
function buildExamData(levelId, variant, customSeed) {
  let seed = customSeed !== undefined
    ? customSeed
    : (variant === 'official' ? 1001 : (variant === 'mockA' ? 2002 : Math.floor(Math.random() * 9000000) + 3000));
  function nextRand() {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  }
  function pick(arr) {
    return arr[Math.floor(nextRand() * arr.length)];
  }
  function shuffle(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(nextRand() * (i + 1));
      const tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy;
  }
  const rng = { nextRand, pick, shuffle };

  if (levelId === 'P') return generatePrimerExam(variant, rng);
  if (levelId === '1') return generateLevel1Exam(variant, rng);
  if (levelId === '2') return generateLevel2Exam(variant, rng);
  if (levelId === '3') return generateLevel3Exam(variant, rng);
  if (levelId === '4') return generateLevel4Exam(variant, rng);
  if (levelId === '5') return generateLevel5Exam(variant, rng);
  if (levelId === '6') return generateLevel6Exam(variant, rng);
  if (levelId === '7') return generateLevel7Exam(variant, rng);
  return generateLevel8Exam(variant, rng);
}

// ============================================================================
// INTERACTIVE STATE & UI RENDERING
// ============================================================================
let currentLevelId = 'P';
let currentVariant = 'official';
let randomSetCounter = 1;
let isAnswerKeyVisible = false;
let currentExamData = null;

function renderLevelSelector() {
  const bar = document.getElementById('levelSelectorBar');
  bar.innerHTML = LEVELS.map(lv => {
    const active = lv.id === currentLevelId;
    const cls = active
      ? 'bg-blue-600 text-white shadow-sm border border-blue-700'
      : 'bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200';
    return `<button onclick="selectLevel('${lv.id}')" class="level-btn ${cls}">${lv.label}</button>`;
  }).join('');

  const banner = document.getElementById('syllabusBanner');
  banner.innerHTML = SYLLABUS_INFO[currentLevelId] || '';
}

function updateVariantButtons() {
  const map = { official: 'btnVarOfficial', mockA: 'btnVarMockA', random: 'btnVarRandom' };
  Object.keys(map).forEach(k => {
    const btn = document.getElementById(map[k]);
    if (!btn) return;
    if (k === currentVariant) {
      btn.className = 'touch-select px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-bold border border-blue-700 bg-blue-600 text-white shadow-sm transition';
    } else {
      btn.className = 'touch-select px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-semibold border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition';
    }
  });
  const randWrap = document.getElementById('randomGeneratorActionWrap');
  if (randWrap) {
    if (currentVariant === 'random') randWrap.classList.remove('hidden');
    else randWrap.classList.add('hidden');
  }
  const badge = document.getElementById('randomSetCounterBadge');
  if (badge) badge.textContent = `Random Set #${randomSetCounter}`;
}

function updateAnswerKeyToggleButton() {
  const btn = document.getElementById('btnToggleKey');
  if (!btn) return;
  if (isAnswerKeyVisible) {
    btn.className = 'touch-select px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-bold border border-red-600 bg-red-600 text-white shadow-sm transition';
    btn.innerHTML = '🙈 Hide Answer Key';
  } else {
    btn.className = 'touch-select px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-bold border border-amber-400 bg-amber-50 hover:bg-amber-100 text-amber-900 shadow-sm transition';
    btn.innerHTML = '👁️ Show Answer Key';
  }
}

function renderDspfPages(showKey) {
  const container = document.getElementById('dspfPagesContainer');
  if (!container || !currentExamData) return;

  const pagesArr = showKey ? currentExamData.pagesKey : currentExamData.pages;
  let html = '';

  pagesArr.forEach((blocks, pageIdx) => {
    const pageNum = pageIdx + 1;
    let pageHeader = '';
    if (pageNum === 1) {
      pageHeader = `
        <div style="text-align: center; margin-bottom: 16px;">
          <div style="font-size: 22px; font-weight: normal; line-height: 1.2;">Dorothy Sutton Performance Festival</div>
          <div style="font-size: 18.5px; font-weight: normal; margin-top: 2px;">
            ${currentExamData.headerTitle}
            ${showKey ? '<span style="color:#d00000; font-weight:bold; font-size:15px; margin-left:8px;">[ANSWER KEY]</span>' : ''}
          </div>
        </div>
      `;
    } else if (pageNum === 2) {
      pageHeader = `<div style="font-size: 14px; margin-bottom: 10px; text-align: left;">2</div>`;
    } else {
      pageHeader = `<div style="font-size: 14px; margin-bottom: 10px; text-align: right;">3</div>`;
    }

    const pageFooter = `
      <div style="position: absolute; bottom: 0.36in; right: 0.6in; font-size: 12.8px; color: #000;">
        ${currentExamData.footerTitle}${showKey ? ' - KEY' : ''} - p.${pageNum}
      </div>
    `;

    html += `
      <div class="dspf-page">
        ${pageHeader}
        ${blocks.join('')}
        ${pageFooter}
      </div>
    `;
  });

  container.innerHTML = html;
}

function selectLevel(lvId) {
  currentLevelId = lvId;
  currentExamData = buildExamData(currentLevelId, currentVariant);
  renderLevelSelector();
  renderDspfPages(isAnswerKeyVisible);
}

function selectVariant(varName) {
  currentVariant = varName;
  if (varName === 'random') randomSetCounter = 1;
  currentExamData = buildExamData(currentLevelId, currentVariant);
  updateVariantButtons();
  renderDspfPages(isAnswerKeyVisible);
}

function rollNewRandomExam() {
  currentVariant = 'random';
  randomSetCounter++;
  currentExamData = buildExamData(currentLevelId, 'random');
  updateVariantButtons();
  renderDspfPages(isAnswerKeyVisible);
}

function toggleAnswerKey() {
  isAnswerKeyVisible = !isAnswerKeyVisible;
  updateAnswerKeyToggleButton();
  renderDspfPages(isAnswerKeyVisible);
}

function printDspfExam(printAsKey) {
  const prevKeyState = isAnswerKeyVisible;
  renderDspfPages(printAsKey);
  window.print();
  if (prevKeyState !== printAsKey) {
    renderDspfPages(prevKeyState);
  }
}

function initApp() {
  if (typeof window.__LOCK_APP === 'function') {
    const lockBtn = document.getElementById('btnLockApp');
    if (lockBtn) lockBtn.classList.remove('hidden');
  }
  renderLevelSelector();
  updateVariantButtons();
  updateAnswerKeyToggleButton();
  currentExamData = buildExamData(currentLevelId, currentVariant);
  renderDspfPages(isAnswerKeyVisible);
}

initApp();
</script>
